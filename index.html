<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre de Controle Ampec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F4F2F2;
  --surface:#FEFEFE;
  --surface-2:#EDEAEA;
  --border:#D7D4D4;
  --ink:#00121E;
  --ink-2:#48505C;
  --ink-3:#828B98;
  --accent:#8F1D21;
  --accent-strong:#400001;
  --accent-ink:#FEFEFE;
  --c-ampec:#8F1D21;
  --c-edn:#2A6FB0;
  --c-mapec:#2F9E4F;
  --c-shopee:#B8901E;
  --c-ml:#B33F6A;
  --c-tiktok:#2E7D32;
  --c-amazon:#4A3AA7;
  --c-olist:#C1382E;
  --status-good:#1F7A45;
  --status-warning:#92600A;
  --status-critical:#B42323;
  --focus:#2A6FB0;
  --shadow: 0 1px 2px rgba(20,26,34,.06), 0 1px 1px rgba(20,26,34,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0D12;
    --surface:#12161D;
    --surface-2:#1A1F27;
    --border:#2B3340;
    --ink:#F4F2F2;
    --ink-2:#AEB6C2;
    --ink-3:#727C8A;
    --accent:#C43B3F;
    --accent-strong:#E2565B;
    --accent-ink:#FEFEFE;
    --c-ampec:#C43B3F;
    --c-edn:#4A8FC7;
    --c-mapec:#2F9456;
    --c-shopee:#A87D1C;
    --c-ml:#D45F8A;
    --c-tiktok:#4FA354;
    --c-amazon:#8B7CD6;
    --c-olist:#DD5C51;
    --status-good:#4ADE80;
    --status-warning:#F5C451;
    --status-critical:#F87171;
    --focus:#4A8FC7;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 1px 1px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0D12;
  --surface:#12161D;
  --surface-2:#1A1F27;
  --border:#2B3340;
  --ink:#F4F2F2;
  --ink-2:#AEB6C2;
  --ink-3:#727C8A;
  --accent:#C43B3F;
  --accent-strong:#E2565B;
  --accent-ink:#FEFEFE;
  --c-ampec:#C43B3F;
  --c-edn:#4A8FC7;
  --c-mapec:#2F9456;
  --c-shopee:#A87D1C;
  --c-ml:#D45F8A;
  --c-tiktok:#4FA354;
  --c-amazon:#8B7CD6;
  --c-olist:#DD5C51;
  --status-good:#4ADE80;
  --status-warning:#F5C451;
  --status-critical:#F87171;
  --focus:#4A8FC7;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 1px 1px rgba(0,0,0,.3);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0; overflow-x:hidden; max-width:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric:tabular-nums;}
h1,h2,h3{font-family:"Manrope", ui-sans-serif, sans-serif; font-weight:800; letter-spacing:-0.01em; text-wrap:balance; margin:0;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:color-mix(in oklab, var(--accent) 35%, transparent);}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

.eyebrow{
  font-family:"Manrope", sans-serif;
  font-weight:700;
  font-size:.72rem;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--ink-3);
}

.app{display:flex; min-height:100vh; width:100%;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:232px; flex-shrink:0;
  background:#00121E;
  color:#DCE1E9;
  display:flex; flex-direction:column;
  padding:20px 14px;
  gap:22px;
  position:fixed; top:0; left:0; height:100vh; z-index:10;
}
.brand{padding:0 8px;}
.brand-mark{
  display:flex; align-items:center; gap:9px; margin-bottom:2px;
}
.brand-badge{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(155deg, #8F1D21, #400001);
  display:flex;align-items:center;justify-content:center;
  font-family:"Manrope",sans-serif; font-weight:800; font-size:.82rem; color:#FEFEFE;
  flex-shrink:0;
}
.brand-name{font-family:"Manrope",sans-serif; font-weight:800; font-size:1.02rem; color:#F4F6F8;}
.brand-sub{font-size:.72rem; color:#8891A0; margin-top:2px;}
.sidebar-bar{display:contents;} /* no PC some — brand/nav/rodapé ficam direto na coluna da .sidebar; no mobile vira a barra real, ver media query */
.nav-group{display:flex;flex-direction:column;gap:2px;}
.nav-eyebrow{
  font-family:"Manrope",sans-serif; font-weight:700; font-size:.68rem; letter-spacing:.12em;
  text-transform:uppercase; color:#5C6675; padding:0 10px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:8px;
  background:transparent; border:none; color:#B7BFCB;
  font-size:.9rem; font-weight:500; text-align:left; cursor:pointer;
  border-left:3px solid transparent;
  width:100%;
}
.nav-item:hover{background:rgba(255,255,255,.05); color:#F1F3F5;}
.nav-item.active{
  background:rgba(143,29,33,.28);
  color:#FFE3E2;
  border-left:3px solid var(--c-ampec);
  font-weight:600;
}
.nav-item .ic{font-size:1.02rem; width:20px; text-align:center; flex-shrink:0;}
.nav-item .caret{display:inline-block; margin-left:auto; font-size:.65rem; color:#6B7480; flex-shrink:0; transition:transform .12s ease;}
.nav-item .tag{
  margin-left:auto; font-size:.63rem; font-weight:700; letter-spacing:.04em;
  padding:1px 6px; border-radius:99px; background:rgba(255,255,255,.08); color:#9AA3AF;
}
.sidebar-foot{
  margin-top:auto; padding:10px 10px 2px; font-size:.72rem; color:#5C6675;
  border-top:1px solid rgba(255,255,255,.08); padding-top:12px;
}

/* ---------- Nav group flyout (Inbound/Outbound subcategorias) ---------- */
/* Abre só ao CLICAR na categoria (não no hover) — mesmo comportamento no
   PC e no mobile, já que no touch não existe hover pra abrir mesmo. */
.nav-group-item{position:relative;}
.nav-group-item.open .nav-item .caret{transform:rotate(90deg);}
.nav-flyout{
  position:absolute; left:100%; top:0; margin-left:6px; z-index:40;
  background:#171C25; border:1px solid #2B3340;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  border-radius:10px; min-width:210px; padding:6px;
  display:none; flex-direction:column;
}
.nav-group-item.open .nav-flyout{display:flex;}
.nav-flyout button{
  display:flex; align-items:center; width:100%; text-align:left;
  padding:8px 10px; border-radius:7px; border:none; background:transparent;
  color:#B7BFCB; font-size:.85rem; font-weight:500; cursor:pointer; font-family:inherit;
}
.nav-flyout button:hover{background:rgba(255,255,255,.06); color:#F1F3F5;}
.nav-flyout button.active{background:rgba(143,29,33,.28); color:#FFE3E2; font-weight:700;}

/* Painel mobile das subcategorias: bloco normal, embaixo da barra, SEM
   position:fixed/absolute — no Safari/Chrome do iOS, um elemento fixed
   dentro de um ancestral com overflow-x:auto (a barra de nav rolável)
   renderiza fora do lugar/escondido (bug conhecido do WebKit). Some por
   padrão (usado só na media query mobile abaixo). */
.nav-mobile-flyout{display:none;}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; display:flex; flex-direction:column; margin-left:232px;}
.topbar{
  position:sticky; top:0; z-index:5;
  background:color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);
  padding:16px 28px;
  display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between;
}
.topbar h1{font-size:1.5rem;}
.topbar p{margin:4px 0 0; color:var(--ink-2); font-size:.88rem; max-width:56ch;}
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.segmented{
  display:inline-flex; flex-wrap:wrap; max-width:100%; background:var(--surface-2); border:1px solid var(--border);
  border-radius:9px; padding:2px; gap:2px;
}
.segmented button{
  border:none; background:transparent; color:var(--ink-2);
  font-size:.8rem; font-weight:600; padding:6px 11px; border-radius:7px; cursor:pointer;
}
.segmented button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
.segmented button[data-company]{display:flex; align-items:center; gap:6px;}
.dot{width:8px;height:8px;border-radius:50%; flex-shrink:0;}

.content{padding:22px 28px 60px; display:flex; flex-direction:column; gap:34px; min-width:0; max-width:100%;}
.banner-demo{
  display:flex; align-items:center; gap:8px;
  font-size:.78rem; color:var(--ink-3);
  border:1px dashed var(--border); border-radius:8px; padding:7px 12px;
  width:fit-content;
}

section.sector{display:flex; flex-direction:column; gap:14px; min-width:0;}
.sector-head{display:flex; flex-direction:column; gap:2px;}
.sector-head h2{font-size:1.12rem;}
.sector-head .desc{color:var(--ink-2); font-size:.85rem; margin-top:2px;}

.kpi-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:12px;
}
.kpi-card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px 14px 12px; display:flex; flex-direction:column; gap:8px;
  box-shadow:var(--shadow); min-width:0; max-width:100%;
}
.kpi-top{display:flex; justify-content:space-between; align-items:flex-start; gap:6px; min-width:0;}
.kpi-label{font-size:.68rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); max-width:20ch; flex:1 1 auto; min-width:0;}
.kpi-value{font-size:1.62rem; font-weight:600; line-height:1;}
.kpi-value .unit{font-size:.76rem; color:var(--ink-3); font-weight:500; margin-left:4px;}
.kpi-bottom{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.delta{display:inline-flex; align-items:center; gap:4px; font-size:.76rem; font-weight:600;}
.delta.good{color:var(--status-good);}
.delta.warn{color:var(--status-warning);}
.delta.bad{color:var(--status-critical);}
.delta.neutral{color:var(--ink-3);}
.spark{width:76px; height:26px; flex-shrink:0;}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:16px 18px 18px; box-shadow:var(--shadow); min-width:0; max-width:100%;
}
.card-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.card-title{font-size:.95rem; font-weight:700; font-family:"Manrope",sans-serif;}
.legend{display:flex; gap:12px; flex-wrap:wrap; margin:2px 0 6px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--ink-2);}
.chart-wrap{position:relative;}
.chart-wrap svg{width:100%; height:auto; display:block; overflow:visible;}
.tooltip{
  position:absolute; pointer-events:none; z-index:6;
  background:var(--ink); color:var(--bg);
  border-radius:8px; padding:8px 10px; font-size:.76rem;
  box-shadow:0 4px 14px rgba(0,0,0,.22);
  transform:translate(-50%,-110%);
  white-space:nowrap;
  opacity:0; transition:opacity .08s ease;
}
.tooltip.show{opacity:1;}
.tooltip .t-date{font-weight:700; margin-bottom:3px; font-family:"Manrope",sans-serif;}
.tooltip .t-row{display:flex; align-items:center; gap:6px;}
.tooltip .t-row + .t-row{margin-top:2px;}

table{width:100%; border-collapse:collapse; font-size:.84rem;}
.table-wrap{overflow-x:auto; max-width:100%; -webkit-overflow-scrolling:touch;}
th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
th{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); font-weight:700;}
td.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;}
tr:last-child td{border-bottom:none;}

.mini-table-title{font-size:.8rem; font-weight:700; color:var(--ink-2); margin:2px 0 8px;}

.sector-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px;}
.sector-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:18px; display:flex; flex-direction:column; gap:10px; cursor:pointer;
  box-shadow:var(--shadow); text-align:left;
}
.sector-card:hover{border-color:var(--accent);}
.sector-card.muted{opacity:.75;}
.sector-card.static{cursor:default;}
.sector-card.static:hover{border-color:var(--border);}
.sector-card .row1{display:flex; justify-content:space-between; align-items:center;}
.sector-card h3{font-size:1.02rem;}
/* Cards de categoria de erro (Outbound · Erros Operacional) — fundo escuro
   com texto branco, por pedido do dono ("mude a cor dos textos dos cards
   pra branco"); fundo mais vinho quando aberto/expandido pra dar destaque. */
.sector-card.erro-cat-card{background:#00121E; border-color:#00121E; color:#fff;}
.sector-card.erro-cat-card:hover{border-color:var(--accent);}
.sector-card.erro-cat-card .mini-kpis .l{color:rgba(255,255,255,.65);}
.sector-card.erro-cat-card.open{background:linear-gradient(155deg, #8F1D21, #400001); border-color:#8F1D21;}
.chip{
  font-size:.65rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:3px 8px; border-radius:99px;
}
.chip.live{background:color-mix(in oklab, var(--status-good) 18%, transparent); color:var(--status-good);}
.chip.soon{background:var(--surface-2); color:var(--ink-3); border:1px solid var(--border);}
.sector-card .procs{font-size:.8rem; color:var(--ink-2);}
.sector-card .mini-kpis{display:flex; gap:18px; margin-top:2px;}
.sector-card .mini-kpis div{display:flex; flex-direction:column;}
.sector-card .mini-kpis .v{font-family:"IBM Plex Mono",monospace; font-size:1.05rem; font-weight:600;}
.sector-card .mini-kpis .l{font-size:.66rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em;}

.toggle-view{display:inline-flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:2px;}
.toggle-view button{border:none;background:transparent;color:var(--ink-2);font-size:.74rem;font-weight:600;padding:5px 9px;border-radius:6px;cursor:pointer;}
.toggle-view button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

.placeholder{
  display:flex; flex-direction:column; gap:14px; align-items:flex-start;
  padding:38px 6px 10px; max-width:64ch;
}
.placeholder .icon{font-size:2.1rem;}
.placeholder ul{margin:4px 0 0; padding-left:1.1em; color:var(--ink-2); font-size:.92rem; display:flex; flex-direction:column; gap:5px;}

/* ---------- Filter bar ---------- */
.filter-field{display:flex; flex-direction:column; gap:3px;}
.filter-field .fl{font-size:.65rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}
.select, .date-input, .search-input{
  font-family:inherit; font-size:.8rem; font-weight:600; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
  padding:6px 9px; cursor:pointer;
}
.search-input{cursor:text; font-weight:500; min-width:150px;}
.date-input{cursor:pointer; font-family:"IBM Plex Mono",monospace; font-weight:500;}
.filter-field.grow{flex:1; min-width:160px;}
.date-range{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.chipsel{display:flex; flex-wrap:wrap; gap:4px; max-width:360px;}
.chip-btn{
  font-family:inherit; font-size:.76rem; font-weight:600; color:var(--ink-2);
  background:var(--surface-2); border:1px solid var(--border); border-radius:99px;
  padding:5px 10px; cursor:pointer;
}
.chip-btn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700;}
.date-range span{color:var(--ink-3); font-size:.76rem;}

.op-filter-wrap{position:relative;}
.op-filter-btn{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  min-width:150px; text-align:left;
}
.op-filter-btn .caret{font-size:.6rem; color:var(--ink-3); flex-shrink:0;}
.op-dropdown{
  position:absolute; top:calc(100% + 4px); left:0; z-index:30;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  box-shadow:0 8px 24px rgba(20,26,34,.16), var(--shadow);
  padding:6px; min-width:200px; max-height:280px; overflow-y:auto;
  display:flex; flex-direction:column;
}
.op-dropdown label{
  display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:6px;
  font-size:.83rem; color:var(--ink); cursor:pointer;
}
.op-dropdown label:hover{background:var(--surface-2);}
.op-dropdown input[type="checkbox"]{width:15px; height:15px; accent-color:var(--accent); cursor:pointer; flex-shrink:0;}
.op-dropdown hr{border:none; border-top:1px solid var(--border); margin:4px 4px 5px;}

/* ---------- Heatmap ---------- */
.heat-controls{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:2px;}
.heat-legend{display:flex; align-items:center; gap:6px; font-size:.7rem; color:var(--ink-3);}
.heat-legend .ramp{width:64px; height:9px; border-radius:5px; flex-shrink:0;}
.heat-cell-tip{font-weight:700;}

/* ---------- Status pills / progress ---------- */
.pill{
  display:inline-flex; align-items:center; gap:5px; font-size:.72rem; font-weight:700;
  padding:3px 9px; border-radius:99px; white-space:nowrap;
}
.pill.pending{background:color-mix(in oklab, var(--status-warning) 16%, transparent); color:var(--status-warning);}
.pill.done{background:color-mix(in oklab, var(--status-good) 16%, transparent); color:var(--status-good);}
.pill.info{background:color-mix(in oklab, var(--accent) 16%, transparent); color:var(--accent-strong);}
.pill.critical{background:color-mix(in oklab, var(--status-critical) 16%, transparent); color:var(--status-critical);}
.pill::before{content:"●"; font-size:.6rem;}

/* ---------- Calendário (Fulfillment) ---------- */
.cal-grid{
  display:grid; grid-template-columns:repeat(7,1fr); gap:1px;
  background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden;
}
.cal-head{
  background:var(--surface-2); color:var(--ink-3); font-size:.68rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.05em; padding:8px 6px; text-align:center;
}
.cal-cell{background:var(--surface); min-height:86px; padding:6px; display:flex; flex-direction:column; gap:3px;}
.cal-cell.cal-empty{background:var(--bg);}
.cal-cell.cal-today{background:color-mix(in oklab, var(--accent) 8%, var(--surface));}
.cal-daynum{font-size:.78rem; font-weight:700; color:var(--ink-2);}
.cal-cell.cal-today .cal-daynum{color:var(--accent-strong);}
.cal-chip{
  display:flex; align-items:center; gap:5px; font-size:.68rem; font-weight:600; color:var(--ink);
  background:var(--surface-2); border-left:3px solid var(--ink-3); border-radius:5px;
  padding:2px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
@media (max-width:640px){
  .cal-cell{min-height:60px;}
  .cal-chip{font-size:.62rem;}
}

.pbar-row{display:flex; align-items:center; gap:10px;}
.pbar-label{width:120px; flex-shrink:0; font-size:.82rem; display:flex; align-items:center; gap:6px;}
.pbar-track{flex:1; height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden;}
.pbar-fill{height:100%; border-radius:5px;}
.pbar-val{width:78px; flex-shrink:0; text-align:right; font-family:"IBM Plex Mono",monospace; font-size:.82rem; font-weight:600;}

/* ---------- Fonte badge (Inbound/Outbound) ---------- */
.fonte-badge{
  display:inline-flex; align-items:center; gap:5px; font-size:.68rem; font-weight:700;
  padding:2px 8px; border-radius:99px; margin-top:5px; white-space:nowrap;
}
.fonte-badge.live{background:color-mix(in oklab, var(--status-good) 16%, transparent); color:var(--status-good);}
.fonte-badge.ficticio{background:var(--surface-2); color:var(--ink-3); border:1px solid var(--border);}
.fonte-badge::before{content:"●"; font-size:.55rem;}

/* ---------- Fontes de Dados ---------- */
.conn-warning{
  display:flex; gap:10px; align-items:flex-start;
  background:color-mix(in oklab, var(--status-warning) 10%, var(--surface));
  border:1px solid color-mix(in oklab, var(--status-warning) 35%, var(--border));
  border-radius:12px; padding:13px 15px; font-size:.84rem; color:var(--ink-2);
}
.conn-warning .ic{font-size:1.15rem; flex-shrink:0; line-height:1.1;}
.conn-warning strong{color:var(--ink);}

(function(){

  function mulberry32(seed){
    return function(){

      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

  function subscribeTable(table, onChange){

  /* ---- Insumos ---- */
  var INSUMOS = [];

    return {

    };

    var res = await sb.from("insumos").select("*").order("nome");

    INSUMOS = res.data.map(insumoFromRow);

      valor_unitario:d.valorUnitario||0, unidade:d.unidade||"un",

      observacao:d.observacao||""

    var idx = INSUMOS.findIndex(function(i){ return i.id===id; });

  function insumoById(id){ return INSUMOS.filter(function(i){ return i.id===id; })[0]; }

  /* ---- Movimentação de estoque de insumos (adicionar/debitar/ajustar) ---- */
  // Cada linha aqui é 1 mudança de estoque com data/hora — histórico auditável,
  // separado do cadastro do insumo (INSUMOS só guarda o saldo atual).
  var INSUMO_MOVS = [];
  function insumoMovFromRow(r){
    return {id:r.id, insumoId:r.insumo_id, tipo:r.tipo, valor:Number(r.valor), estoqueAntes:Number(r.estoque_antes), estoqueDepois:Number(r.estoque_depois), delta:Number(r.delta), quando:r.quando};
  }
  async function carregarInsumoMovs(){
    var res = await sb.from("insumo_movs").select("*").order("quando", {ascending:false}).limit(1000);
    if (res.error){ console.error("Falha ao carregar movimentações:", res.error); return; }
    INSUMO_MOVS = res.data.map(insumoMovFromRow);
  }
  async function registrarInsumoMov(mov){
    var res = await sb.from("insumo_movs").insert({
      insumo_id:mov.insumoId, tipo:mov.tipo, valor:mov.valor,
      estoque_antes:mov.estoqueAntes, estoque_depois:mov.estoqueDepois, delta:mov.delta
    }).select().single();
    if (res.error) throw res.error;
    INSUMO_MOVS.unshift(insumoMovFromRow(res.data));
  }
  // Remove um registro de movimentação. Se for a movimentação MAIS RECENTE
  // daquele insumo, também desfaz o efeito dela no estoque atual (ex.: um
  // teste de "debitar 150" errado, removido na hora, devolve as 150
  // unidades). Se já existir movimentação posterior (ex.: um "ajustar"
  // manual feito depois pra corrigir o físico), só apaga o registro do
  // histórico/relatório — o estoque atual não é tocado, porque já foi
  // corrigido por aquela movimentação posterior e reverter aqui iria
  // estragar o que já está certo.
  async function removerInsumoMov(mov){
    var movsDoInsumo = INSUMO_MOVS.filter(function(m){ return m.insumoId===mov.insumoId; });
    var maisRecente = movsDoInsumo.reduce(function(a,b){
      return (!a || new Date(b.quando) > new Date(a.quando)) ? b : a;
    }, null);
    if (maisRecente && maisRecente.id === mov.id){
      var ins = insumoById(mov.insumoId);
      if (ins){
        await atualizarInsumo(ins.id, {
          nome:ins.nome, categoria:ins.categoria, fornecedor:ins.fornecedor,
          valorUnitario:ins.valorUnitario, unidade:ins.unidade,
          estoque:ins.estoque - mov.delta, estoqueMinimo:ins.estoqueMinimo, observacao:ins.observacao
        });
      }
    }
    var res = await sb.from("insumo_movs").delete().eq("id", mov.id);
    if (res.error) throw res.error;
    var idx = INSUMO_MOVS.findIndex(function(m){ return m.id===mov.id; });
    if (idx>-1) INSUMO_MOVS.splice(idx,1);
  }

  var SKU_INSUMO_MAP = loadSkuInsumoMap();

  /* ---- Ajuda: Perguntas Frequentes ---- */

  /* ---- Outbound: colaboradores (Responsável dos erros operacionais) ---- */
  var USUARIOS = [];
  function usuarioFromRow(r){ return {id:r.id, nome:r.nome}; }
  async function carregarUsuarios(){

  // Cria sozinho qualquer "Responsável" novo que apareça nos erros recém
  // sincronizados da planilha — sem duplicar (upsert com nome único; se já
  // existir, o upsert só ignora) e sem travar o sync se um nome falhar.
  async function autoCriarUsuariosDosErros(){
    var existentes = {};
    USUARIOS.forEach(function(u){ existentes[normalizeText(u.nome)] = true; });
    var novosNomes = {};
    ERROS_OPERACIONAIS.forEach(function(e){
      var nome = (e.responsavel||"").trim();
      if (nome && !existentes[normalizeText(nome)]) novosNomes[nome] = true;

    var lista = Object.keys(novosNomes);

        var res = await sb.from("usuarios").upsert({nome:lista[i]}, {onConflict:"nome", ignoreDuplicates:true}).select();

  var MIPS = [];
  function mipAnexoFromRow(r){ return {id:r.id, nome:r.nome, tipo:r.tipo||"", tamanho:Number(r.tamanho)||0, storagePath:r.storage_path}; }
  function mipFromRow(r, anexosRows){
    return {

  // Custo estimado de insumos no período: distribui os pedidos embalados entre os SKUs
  // proporcionalmente ao peso (mesma heurística da curva ABC), e aplica os vínculos SKU->insumo.
  // É uma estimativa (não há dado real de "qual SKU foi embalado em qual pedido").
  function insumoCostForPeriod(totalEmbalados){
    var pesoTotal = sum(SKUS, function(s){ return s.peso; });
    var porInsumo = {};
    SKUS.forEach(function(s){
      var qtdSku = pesoTotal ? totalEmbalados * s.peso / pesoTotal : 0;
      var vinculos = SKU_INSUMO_MAP[s.codigo] || [];
      vinculos.forEach(function(v){
        var insumo = INSUMOS.filter(function(i){ return i.id === v.insumoId; })[0];
        if (!insumo) return;
        var qtdInsumo = qtdSku * v.qtd;
        if (!porInsumo[insumo.id]) porInsumo[insumo.id] = {insumo:insumo, qtd:0, custo:0};
        porInsumo[insumo.id].qtd += qtdInsumo;
        porInsumo[insumo.id].custo += qtdInsumo * insumo.valorUnitario;
      });
    });
    var rows = Object.keys(porInsumo).map(function(k){ return porInsumo[k]; });
    rows.sort(function(a,b){ return b.custo - a.custo; });
    return {rows:rows, total: sum(rows, function(r){ return r.custo; })};
  }

  function parseCSV(text){

      } else {

        else if (ch === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
        else field += ch;
      }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }

  }

        if (f.isDim && /(empresa|plataforma|marketplace|canal|company|loja)/.test(nh)) score = Math.max(score, 80);

        if (f.key === "tempoMedio" && /tempo/.test(nh)) score = Math.max(score, 60);

        if (f.key === "tempoEmb" && /embalag/.test(nh)) score = Math.max(score, 80);

      var table = await fetchTable(draft);
      if (!table.rows.length) throw new Error("A fonte respondeu, mas nenhuma linha de dados foi encontrada.");
      state.connPreview = table;
      if (!draft.mapping || !Object.keys(draft.mapping).length){
        draft.mapping = suggestMapping(TARGET_SCHEMAS[draft.targetAba], table);
      }
    } catch(err){
      state.connError = err && err.message ? err.message : "Não foi possível conectar a esta fonte.";
      state.connPreview = null;
    }
    state.connBusy = false;
    render();
  }
  async function doSyncDraft(){
    var draft = state.connDraft;
    var ok = await doSyncConnection(draft);
    if (ok){
      if (draft.id === null){ draft.id = ++CONN_SEQ; CONNECTIONS.push(draft); }
      saveConnections();
      state.connDraft = null;
      state.connPreview = null;
    }
    render();
  }
  async function doSyncExisting(idx){
    var conn = CONNECTIONS[idx];
    if (!conn) return;
    await doSyncConnection(conn);
    saveConnections();
    render();
  }
  (function reaplicarConexoesSalvas(){
    CONNECTIONS.forEach(function(conn){
      if (conn.status === "ok" && conn.cachedRows && conn.cachedRows.length){
        try { mergeIntoData(conn.targetAba, conn.cachedRows.map(deserializeRow)); } catch(e){}
      }
    });
  })();
  function connStatusFor(targetAba){
    var matches = CONNECTIONS.filter(function(c){ return c.targetAba === targetAba && c.status === "ok"; });
    if (!matches.length) return null;
    matches.sort(function(a,b){ return new Date(b.lastSync) - new Date(a.lastSync); });
    return matches[0];
  }
  function fonteBadge(targetAba){
    var conn = connStatusFor(targetAba);
    if (conn) return '<span class="fonte-badge live">Dados conectados · ' + conn.nome + '</span>';
    return '<span class="fonte-badge ficticio">Dados fictícios (demonstração)</span>';
  }

  function windowData(offset){
    // offset 0 = período atual (selecionado), offset 1 = período imediatamente anterior, mesma duração
    var start = parseISO(state.dateStart), end = parseISO(state.dateEnd);
    if (end < start){ var t = start; start = end; end = t; }
    var spanDays = Math.round((end - start) / 86400000) + 1;
    if (offset === 1){
      var newEnd = new Date(start); newEnd.setDate(newEnd.getDate() - 1);
      var newStart = new Date(newEnd); newStart.setDate(newStart.getDate() - (spanDays-1));
      start = newStart; end = newEnd;
    }
    return DATA.filter(function(d){ return d.date >= start && d.date <= end; });
  }

  /* ============================ FORMAT HELPERS ============================ */
  function escAttr(s){ return (s===undefined||s===null?"":String(s)).replace(/"/g,"&quot;"); }
  // Escapa texto de usuário inserido como CONTEÚDO de tag (não atributo) — usado
  // pelos módulos de Ajuda (FAQ/MIP), que guardam texto livre longo e o
  // re-exibem pra todo mundo que abrir o arquivo depois.
  function escHtml(s){
    return (s===undefined||s===null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function fmtInt(n){ return Math.round(n).toLocaleString("pt-BR"); }
  function fmtDec(n,d){ d = d===undefined?1:d; return n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
  // Duração em minutos -> {value, unit} na maior unidade legível: até 59min
  // fica em minutos, de 1h até 23h59 vira horas, 24h+ vira dias.
  function fmtDuracaoParts(min){
    min = min || 0;
    if (min < 60) return {value: fmtDec(min,1), unit:"min"};
    if (min < 1440) return {value: fmtDec(min/60,1), unit:"h"};
    return {value: fmtDec(min/1440,1), unit:"dias"};
  }
  function fmtDuracao(min){
    var p = fmtDuracaoParts(min);
    return p.value + " " + p.unit;
  }
  function fmtPct(n){ var s = (n>=0?"+":"") + n.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}); return s + "%"; }
  function fmtDateTime(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }

  function sum(arr, fn){ return arr.reduce(function(a,x){ return a + fn(x); }, 0); }
  function avg(arr, fn){ return arr.length ? sum(arr, fn) / arr.length : 0; }

  function pctChange(cur, prev){ if (!prev) return 0; return (cur-prev)/prev*100; }

  function deltaBadge(cur, prev, kind){
    // kind: 'higher-better' | 'lower-better' | 'neutral'
    var pct = pctChange(cur, prev);
    var arrow = pct >= 0 ? "▲" : "▼";
    var cls = "neutral";
    if (kind === "higher-better"){ cls = pct >= 1 ? "good" : (pct <= -1 ? "bad" : "neutral"); }
    if (kind === "lower-better"){ cls = pct <= -1 ? "good" : (pct >= 1 ? "bad" : "neutral"); }
    return '<span class="delta ' + cls + '">' + arrow + ' ' + fmtPct(Math.abs(pct)*(pct<0?-1:1)) + ' <span style="color:var(--ink-3);font-weight:500;">vs. período anterior</span></span>';
  }

  /* ============================ MOCK SPARKLINE ============================ */
  function sparkSvg(values, colorVar){
    var w = 76, h = 26, pad = 3;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (max === min){ max = min + 1; }
    var n = values.length;
    var pts = values.map(function(v,i){
      var x = pad + (i/(n-1)) * (w - pad*2);
      var y = h - pad - ((v-min)/(max-min)) * (h - pad*2);
      return [x,y];
    });
    var line = pts.map(function(p,i){ return (i===0?"M":"L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    var area = line + " L" + pts[pts.length-1][0].toFixed(1) + "," + (h-pad) + " L" + pts[0][0].toFixed(1) + "," + (h-pad) + " Z";
    var last = pts[pts.length-1];
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="spark" preserveAspectRatio="none">' +
      '<path d="' + area + '" style="fill:' + colorVar + '; opacity:.14;"></path>' +
      '<path d="' + line + '" style="fill:none; stroke:' + colorVar + '; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;"></path>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.1" style="fill:' + colorVar + ';"></circle>' +
      '</svg>';
  }

  /* ============================ KPI CARD ============================ */
  var kpiCounter = 0;
  function kpiCard(label, value, unit, cur, prev, kind, sparkValues, sparkColor, extraHtml){
    kpiCounter++;
    return '<div class="kpi-card">' +
      '<div class="kpi-top">' +
        '<div class="kpi-label">' + label + '</div>' +
        (sparkValues ? sparkSvg(sparkValues, sparkColor || "var(--accent)") : "") +
      '</div>' +
      '<div class="kpi-value">' + value + (unit ? '<span class="unit">' + unit + '</span>' : '') + '</div>' +
      '<div class="kpi-bottom">' + deltaBadge(cur, prev, kind) + '</div>' +
      (extraHtml || "") +
    '</div>';
  }

  /* ============================ META BADGE ============================ */
  function metaBadge(valorMedioDia, meta, higherBetter, metaLabel){
    var atingida = higherBetter ? valorMedioDia >= meta : valorMedioDia <= meta;
    var cls = atingida ? "good" : "bad";
    var icon = atingida ? "✓" : "✕";
    return '<div style="margin-top:6px; padding-top:6px; border-top:1px solid var(--border);">' +
      '<span class="delta ' + cls + '" style="font-weight:700;">' + icon + ' ' + (atingida ? "dentro da meta" : "abaixo da meta") + '</span> ' +
      '<span style="color:var(--ink-3); font-size:.76rem;">(meta: ' + (metaLabel || fmtInt(meta)) + ')</span>' +
    '</div>';
  }

  function snapshotCard(label, value, unit, note){
    return '<div class="kpi-card">' +
      '<div class="kpi-top"><div class="kpi-label">' + label + '</div></div>' +
      '<div class="kpi-value">' + value + (unit ? '<span class="unit">' + unit + '</span>' : '') + '</div>' +
      '<div class="kpi-bottom"><span class="delta neutral">' + (note || "") + '</span></div>' +
    '</div>';
  }

  /* ============================ COMPARISON TABLE (multi-operador) ============================ */
  function comparisonTable(names, cur, metrics){
    var totals = names.map(function(name){
      return metrics.map(function(m){ return sum(cur, function(d){ return m.fn(d, name); }); });
    });
    var avgs = metrics.map(function(m, mi){
      var colVals = totals.map(function(row){ return row[mi]; });
      return colVals.length ? colVals.reduce(function(a,b){return a+b;},0) / colVals.length : 0;
    });
    var maxes = metrics.map(function(m, mi){
      return Math.max.apply(null, totals.map(function(row){ return row[mi]; }));
    });

    var header = '<tr><th>Operador</th>' + metrics.map(function(m){ return '<th>' + m.label + '</th>'; }).join("") + '</tr>';
    var rows = names.map(function(name, ni){
      var cells = metrics.map(function(m, mi){
        var val = totals[ni][mi];
        var avgVal = avgs[mi];
        var pct = avgVal ? (val - avgVal) / avgVal * 100 : 0;
        var isTop = val === maxes[mi] && maxes[mi] > 0;
        var valHtml = isTop ? '<strong>' + fmtInt(val) + '</strong>' : fmtInt(val);
        return '<td class="num">' + valHtml +
          '<br><span class="delta neutral" style="font-size:.7rem;">' + fmtPct(pct) + ' vs. média</span></td>';
      }).join("");
      return '<tr><td>' + name + '</td>' + cells + '</tr>';
    }).join("");

    return '<div class="table-wrap"><table><thead>' + header + '</thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* ============================ CHART BUILDERS ============================ */

  function niceMax(v){
    if (v <= 0) return 10;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var steps = [1,2,2.5,5,10];
    for (var i=0;i<steps.length;i++){
      var cand = steps[i]*mag;
      if (cand >= v) return cand;
    }
    return Math.ceil(v/mag)*mag;
  }

  // ---- Stacked bar chart (Recebimento por empresa) ----
  function stackedBarChart(id, days, seriesKeys, valueFn, colorFn, nameFn){
    // seriesKeys: array of ids to stack (filtered). colorFn/nameFn default to empresa lookups.
    colorFn = colorFn || empresaColor;
    nameFn = nameFn || empresaNome;
    var W = 720, H = 260, padL = 46, padR = 12, padT = 12, padB = 30;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var n = days.length;
    var slot = plotW / n;
    var barW = Math.max(3, slot * (n > 20 ? 0.62 : 0.56));

    var totals = days.map(function(day){
      return sum(seriesKeys, function(k){ return valueFn(day, k); });
    });
    var maxV = niceMax(Math.max.apply(null, totals.concat([1])));

    var gridLines = [0,0.25,0.5,0.75,1].map(function(f){
      var y = padT + plotH - f*plotH;
      var val = Math.round(f*maxV);
      return '<line x1="' + padL + '" x2="' + (W-padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" style="stroke:var(--border); stroke-width:1;"></line>' +
        '<text x="' + (padL-8) + '" y="' + (y+3).toFixed(1) + '" text-anchor="end" style="font-size:9.5px; fill:var(--ink-3); font-family:\'IBM Plex Mono\',monospace;">' + fmtInt(val) + '</text>';
    }).join("");

    var labelEvery = n > 20 ? 3 : (n > 10 ? 2 : 1);

    var bars = days.map(function(day, i){
      var x = padL + i*slot + (slot-barW)/2;
      var yCursor = H - padB;
      var segs = "";
      seriesKeys.forEach(function(k){
        var v = valueFn(day, k);
        var segH = (v/maxV) * plotH;
        var rectY = yCursor - segH;
        segs += '<rect x="' + x.toFixed(1) + '" y="' + (rectY+1).toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(0,segH-2).toFixed(1) + '" rx="3" style="fill:' + colorFn(k) + ';"></rect>';
        yCursor = rectY;
      });
      var label = (i % labelEvery === 0) ? '<text x="' + (padL + i*slot + slot/2).toFixed(1) + '" y="' + (H-10) + '" text-anchor="middle" style="font-size:9.5px; fill:var(--ink-3);">' + day.label + '</text>' : "";
      var payload = JSON.stringify({label:day.label, items: seriesKeys.map(function(k){ return [nameFn(k), valueFn(day,k)]; }), total: totals[i]});
      var hit = '<rect x="' + (padL+i*slot).toFixed(1) + '" y="' + padT + '" width="' + slot.toFixed(1) + '" height="' + plotH + '" fill="transparent" class="hit-rect" data-payload=\'' + payload.replace(/'/g,"&apos;") + '\'></rect>';
      return segs + label + hit;
    }).join("");

    return '<div class="chart-wrap" data-chart="' + id + '">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + gridLines + bars + '</svg>' +
      '<div class="tooltip" data-tip-for="' + id + '"></div>' +
    '</div>';
  }

  // ---- Area/line chart (single hue trend) ----
  function areaLineChart(id, days, valueFn, colorVar, unitLabel){
    var W = 720, H = 220, padL = 46, padR = 14, padT = 16, padB = 28;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var n = days.length;
    var values = days.map(valueFn);
    var maxV = niceMax(Math.max.apply(null, values.concat([1])) * 1.08);
    var minV = 0;

    var xAt = function(i){ return padL + (n===1?0:(i/(n-1))*plotW); };
    var yAt = function(v){ return padT + plotH - ((v-minV)/(maxV-minV))*plotH; };

    var gridLines = [0,0.25,0.5,0.75,1].map(function(f){
      var y = padT + plotH - f*plotH;
      var val = Math.round(f*maxV);
      return '<line x1="' + padL + '" x2="' + (W-padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" style="stroke:var(--border); stroke-width:1;"></line>' +
        '<text x="' + (padL-8) + '" y="' + (y+3).toFixed(1) + '" text-anchor="end" style="font-size:9.5px; fill:var(--ink-3); font-family:\'IBM Plex Mono\',monospace;">' + fmtInt(val) + '</text>';
    }).join("");

    var pts = values.map(function(v,i){ return [xAt(i), yAt(v)]; });
    var line = pts.map(function(p,i){ return (i===0?"M":"L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    var area = line + " L" + pts[pts.length-1][0].toFixed(1) + "," + (padT+plotH) + " L" + pts[0][0].toFixed(1) + "," + (padT+plotH) + " Z";

    var labelEvery = n > 20 ? 3 : (n > 10 ? 2 : 1);
    var xLabels = days.map(function(day,i){
      if (i % labelEvery !== 0) return "";
      return '<text x="' + xAt(i).toFixed(1) + '" y="' + (H-8) + '" text-anchor="middle" style="font-size:9.5px; fill:var(--ink-3);">' + day.label + '</text>';
    }).join("");

    var lastP = pts[pts.length-1];
    var lastVal = values[values.length-1];
    var endpoint = '<circle cx="' + lastP[0].toFixed(1) + '" cy="' + lastP[1].toFixed(1) + '" r="4.5" style="fill:' + colorVar + '; stroke:var(--surface); stroke-width:2;"></circle>' +
      '<text x="' + (lastP[0]-8).toFixed(1) + '" y="' + (lastP[1]-10).toFixed(1) + '" text-anchor="end" style="font-size:11px; font-weight:600; fill:var(--ink); font-family:\'IBM Plex Mono\',monospace;">' + fmtInt(lastVal) + (unitLabel?(" "+unitLabel):"") + '</text>';

    var markers = pts.map(function(p,i){
      return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4" style="fill:' + colorVar + '; stroke:var(--surface); stroke-width:2; opacity:0;" class="pt-marker" data-i="' + i + '"></circle>';
    }).join("");

    var payloads = days.map(function(day,i){ return JSON.stringify({label:day.label, value:values[i]}).replace(/'/g,"&apos;"); });
    var hitW = plotW / n;
    var hits = days.map(function(day,i){
      return '<rect x="' + (padL + i*hitW).toFixed(1) + '" y="' + padT + '" width="' + hitW.toFixed(1) + '" height="' + plotH + '" fill="transparent" class="hit-rect" data-idx="' + i + '" data-payload=\'' + payloads[i] + '\'></rect>';
    }).join("");

    var crosshair = '<line x1="0" x2="0" y1="' + padT + '" y2="' + (padT+plotH) + '" style="stroke:var(--ink-3); stroke-width:1; opacity:0;" class="crosshair"></line>';

    return '<div class="chart-wrap" data-chart="' + id + '">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
        gridLines +
        '<path d="' + area + '" style="fill:' + colorVar + '; opacity:.13;"></path>' +
        '<path d="' + line + '" style="fill:none; stroke:' + colorVar + '; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;"></path>' +
        markers + endpoint + xLabels + crosshair + hits +
      '</svg>' +
      '<div class="tooltip" data-tip-for="' + id + '"></div>' +
    '</div>';
  }

  // ---- Simple bar chart (single hue, Abastecimento) ----
  function barChart(id, days, valueFn, colorVar){
    var W = 720, H = 220, padL = 46, padR = 12, padT = 14, padB = 28;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var n = days.length;
    var slot = plotW/n;
    var barW = Math.max(3, slot * (n>20?0.55:0.48));
    var values = days.map(valueFn);
    var maxV = niceMax(Math.max.apply(null, values.concat([1])));

    var gridLines = [0,0.25,0.5,0.75,1].map(function(f){
      var y = padT + plotH - f*plotH;
      var val = Math.round(f*maxV);
      return '<line x1="' + padL + '" x2="' + (W-padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" style="stroke:var(--border); stroke-width:1;"></line>' +
        '<text x="' + (padL-8) + '" y="' + (y+3).toFixed(1) + '" text-anchor="end" style="font-size:9.5px; fill:var(--ink-3); font-family:\'IBM Plex Mono\',monospace;">' + fmtInt(val) + '</text>';
    }).join("");

    var labelEvery = n > 20 ? 3 : (n > 10 ? 2 : 1);

    var bars = days.map(function(day,i){
      var v = values[i];
      var x = padL + i*slot + (slot-barW)/2;
      var barH = (v/maxV)*plotH;
      var y = padT + plotH - barH;
      var label = (i % labelEvery === 0) ? '<text x="' + (padL+i*slot+slot/2).toFixed(1) + '" y="' + (H-8) + '" text-anchor="middle" style="font-size:9.5px; fill:var(--ink-3);">' + day.label + '</text>' : "";
      var payload = JSON.stringify({label:day.label, value:v}).replace(/'/g,"&apos;");
      var hit = '<rect x="' + (padL+i*slot).toFixed(1) + '" y="' + padT + '" width="' + slot.toFixed(1) + '" height="' + plotH + '" fill="transparent" class="hit-rect" data-payload=\'' + payload + '\'></rect>';
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(0,barH).toFixed(1) + '" rx="4" style="fill:' + colorVar + ';"></rect>' + label + hit;
    }).join("");

    return '<div class="chart-wrap" data-chart="' + id + '">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + gridLines + bars + '</svg>' +
      '<div class="tooltip" data-tip-for="' + id + '"></div>' +
    '</div>';
  }

  // ---- Heatmap (sequential, um hue: accent) ----
  function heatmapChart(id, matrix, hours, weekdayLabels){
    var W = 720, H = 236, padL = 40, padR = 10, padT = 8, padB = 24;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var nCols = hours.length, nRows = weekdayLabels.length;
    var cellW = plotW / nCols, cellH = plotH / nRows;

    var maxV = 1;
    matrix.forEach(function(row){ row.forEach(function(v){ if (v > maxV) maxV = v; }); });

    var cells = "";
    for (var r=0; r<nRows; r++){
      for (var c=0; c<nCols; c++){
        var v = matrix[r][c];
        var t = clamp(v / maxV, 0, 1);
        var mixPct = (8 + t*84).toFixed(0);
        var x = padL + c*cellW, y = padT + r*cellH;
        var payload = JSON.stringify({label: weekdayLabels[r] + " · " + hours[c] + "h–" + (hours[c]+1) + "h", value:v}).replace(/'/g,"&apos;");
        cells += '<rect x="' + (x+1).toFixed(1) + '" y="' + (y+1).toFixed(1) + '" width="' + (cellW-2).toFixed(1) + '" height="' + (cellH-2).toFixed(1) + '" rx="3" ' +
          'style="fill:color-mix(in oklab, var(--accent) ' + mixPct + '%, var(--surface-2));" class="hit-rect" data-payload=\'' + payload + '\'></rect>';
      }
    }

    var rowLabels = weekdayLabels.map(function(lb,r){
      return '<text x="' + (padL-8) + '" y="' + (padT + r*cellH + cellH/2 + 3.5).toFixed(1) + '" text-anchor="end" style="font-size:9.5px; fill:var(--ink-3);">' + lb + '</text>';
    }).join("");
    var colLabels = hours.map(function(h,c){
      if (c % 2 !== 0) return "";
      return '<text x="' + (padL + c*cellW + cellW/2).toFixed(1) + '" y="' + (H-8) + '" text-anchor="middle" style="font-size:9px; fill:var(--ink-3);">' + h + 'h</text>';
    }).join("");

    return '<div class="chart-wrap" data-chart="' + id + '">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + cells + rowLabels + colLabels + '</svg>' +
      '<div class="tooltip" data-tip-for="' + id + '"></div>' +
    '</div>';
  }

  function heatmapLegend(){
    return '<div class="heat-legend"><span>menos</span><span class="ramp" style="background:linear-gradient(90deg, color-mix(in oklab, var(--accent) 8%, var(--surface-2)), var(--accent));"></span><span>mais</span></div>';
  }

  /* ============================ PAGE: NAV / TOPBAR ============================ */

  var NAV_SUBS = {
    inbound: [
      {id:"inventario", label:"Inventário"},

  // Tema claro/escuro — preferência só deste navegador (localStorage),
  // nunca no banco. `data-theme` no <html> já é lido pelo CSS (:root[data-
  // theme="dark"/"light"]); sem atributo, segue o tema do sistema.
  function temaAtual(){
    var attr = document.documentElement.getAttribute("data-theme");
    if (attr === "light" || attr === "dark") return attr;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function aplicarTema(tema){
    document.documentElement.setAttribute("data-theme", tema);
    try { localStorage.setItem("tdc-tema", tema); } catch (e) {}
  }
  function themeToggleHtml(){
    var atual = temaAtual();
    return '<div class="filter-field" style="padding:0 16px 12px;">' +
      '<span class="fl">Tema</span>' +
      '<div class="segmented" data-group="tema">' +
        '<button class="' + (atual==="light"?"active":"") + '" data-tema="light">Claro</button>' +
        '<button class="' + (atual==="dark"?"active":"") + '" data-tema="dark">Escuro</button>' +
      '</div>' +
    '</div>';
  }

    // Painel mobile (ver .nav-mobile-flyout no CSS): mesma lista de

  function abcBadge(cls){

    return '<span style="display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; border:1.5px solid ' + color + '; color:' + color + '; font-weight:700; font-size:.72rem;">' + cls + '</span>';
  }
  function classifyABC(rankedRows, totalQtd){
    // rankedRows já ordenado desc por qtd. Retorna array paralelo de classes A/B/C por cumulativo.
    var cum = 0;
    return rankedRows.map(function(r){
      cum += r.qtd;
      var pct = totalQtd ? cum/totalQtd*100 : 0;
      return pct <= 80 ? "A" : (pct <= 95 ? "B" : "C");
    });
  }

  function mappingUI(draft, schema, table){
    var fieldRows = schema.fields.map(function(f){
      return '<div class="mapping-row">' +
        '<div class="mf-label">' + f.label + (f.required ? '<span class="mf-req">*</span>' : '') + '</div>' +
        '<select data-conn-map="' + f.key + '">' +
          '<option value="">— não mapear —</option>' +
          table.headers.map(function(h){
            var sel = draft.mapping[f.key] === h ? "selected" : "";
            return '<option value="' + h.replace(/"/g,"&quot;") + '" ' + sel + '>' + h + '</option>';
          }).join("") +
        '</select>' +
        '<div></div>' +
      '</div>';
    }).join("");

    var previewHeaders = table.headers.map(function(h){ return '<th>' + h + '</th>'; }).join("");
    var previewRows = table.rows.slice(0,5).map(function(r){
      return '<tr>' + table.headers.map(function(h){ return '<td>' + (r[h]===undefined||r[h]===null?"":r[h]) + '</td>'; }).join("") + '</tr>';
    }).join("");

    var missingRequired = schema.fields.filter(function(f){ return f.required && !draft.mapping[f.key]; });

    return '<div style="margin-top:16px; border-top:1px solid var(--border); padding-top:14px;">' +
      '<div class="mini-table-title">Amostra encontrada (' + table.rows.length + ' linha' + (table.rows.length===1?"":"s") + ')</div>' +
      '<div class="table-wrap"><table><thead><tr>' + previewHeaders + '</tr></thead><tbody>' + previewRows + '</tbody></table></div>' +
      '<div class="conn-preview-note">Mostrando até 5 linhas de exemplo.</div>' +
      '<div class="mini-table-title" style="margin-top:14px;">Mapeamento de colunas</div>' +
      '<div class="conn-preview-note">Associe cada campo da ferramenta a uma coluna da fonte. Campos com <span class="mf-req">*</span> são obrigatórios.</div>' +
      fieldRows +
      '<div class="btn-row" style="margin-top:12px;">' +
        '<button class="btn-primary" data-conn-sync-new ' + (state.connBusy || missingRequired.length ? "disabled" : "") + '>' + (state.connBusy ? "Sincronizando…" : "Sincronizar agora") + '</button>' +
        (missingRequired.length ? '<span class="conn-preview-note">Mapeie: ' + missingRequired.map(function(f){return f.label;}).join(", ") + '</span>' : '') +
      '</div>' +
    '</div>';
  }

  /* ============================ PAGE: INSUMOS ============================ */

  function newInsumoDraft(){
    return {id:null, nome:"", categoria:"", fornecedor:"", valorUnitario:0, unidade:"un", estoque:0, estoqueMinimo:"", observacao:""};
  }
  // Semáforo do estoque — só aparece se o insumo tiver estoque mínimo definido:
  // abaixo do mínimo = vermelho (crítico); no mínimo ou até 100un acima = amarelo
  // (perto); mais de 100un acima = verde (folga).
  function estoqueSemaforo(ins){
    if (!ins.estoqueMinimo) return null;
    if (ins.estoque < ins.estoqueMinimo) return "critical";
    if (ins.estoque <= ins.estoqueMinimo + 100) return "pending";
    return "done";
  }

  function pageInsumos(){
    var draft = state.insumoDraft;

    var rows = INSUMOS.map(function(ins){
      var semaforo = estoqueSemaforo(ins);
      var estoqueTxt = fmtInt(ins.estoque||0) + ' ' + escHtml(ins.unidade);
      var estoqueCell = semaforo ? '<span class="pill ' + semaforo + '">' + estoqueTxt + '</span>' : estoqueTxt;
      if (ins.estoqueMinimo) estoqueCell += ' <span style="color:var(--ink-3); font-size:.76rem; white-space:nowrap;">(mín: ' + fmtInt(ins.estoqueMinimo) + ' ' + escHtml(ins.unidade) + ')</span>';
      var row = '<tr>' +
        '<td>' + escHtml(ins.nome) + (ins.observacao ? '<br><span style="color:var(--ink-3); font-size:.76rem;">' + escHtml(ins.observacao) + '</span>' : '') + '</td>' +
        '<td>' + (ins.categoria ? escHtml(ins.categoria) : "—") + '</td>' +
        '<td>' + (ins.fornecedor ? escHtml(ins.fornecedor) : "—") + '</td>' +
        '<td class="num">' + estoqueCell + '</td>' +

          '<button class="btn-danger" data-insumo-remove="' + ins.id + '">Remover</button>' +
        '</div></td>' +
      '</tr>';
      if (state.insumoMovDraft && state.insumoMovDraft.insumoId === ins.id){

        row += '<tr><td colspan="6"><div class="card" style="margin:6px 0; box-shadow:none; border:1px dashed var(--border);">' +

            ['adicionar','debitar','ajustar'].map(function(t){
