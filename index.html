  // Extraído de wireInteractions() pra poder rewirar só um pedaço do DOM
  // (ex.: o widget do Tiny, que atualiza sozinho via innerHTML direto e
  // NUNCA passa por render()/wireInteractions() — sem isso, os gráficos
  // dele ficavam sem tooltip no hover, porque os listeners só eram
  // criados durante o render() da página inteira).
  function wireChartTooltips(container){
    container.querySelectorAll(".chart-wrap").forEach(function(wrap){
      var svg = wrap.querySelector("svg");
      var tip = wrap.querySelector(".tooltip");
      if (!svg || !tip) return;

      var hitRects = wrap.querySelectorAll(".hit-rect");
      var crosshair = svg.querySelector(".crosshair");
      var markers = wrap.querySelectorAll(".pt-marker");

      function showTip(evt, payload){
        var rect = wrap.getBoundingClientRect();
        var x = evt.clientX - rect.left;
        var y = evt.clientY - rect.top;
        tip.style.left = x + "px";
        tip.style.top = y + "px";
        var html = '<div class="t-date">' + payload.label + '</div>';
        if (payload.items){
          payload.items.forEach(function(it){
            html += '<div class="t-row">' + it[0] + ': <strong class="mono">' + fmtInt(it[1]) + '</strong></div>';
          });
          html += '<div class="t-row" style="margin-top:4px; opacity:.8;">Total: <strong class="mono">' + fmtInt(payload.total) + '</strong></div>';
        } else {
          html += '<div class="t-row"><strong class="mono">' + fmtInt(payload.value) + '</strong></div>';
        }
        tip.innerHTML = html;
        tip.classList.add("show");
      }
      function hideTip(){ tip.classList.remove("show"); }

      hitRects.forEach(function(hr, idx){
        hr.addEventListener("mousemove", function(evt){
          var payload = JSON.parse(hr.getAttribute("data-payload"));
          showTip(evt, payload);
          if (crosshair){
            var rectBB = hr.getBBox();
            crosshair.setAttribute("x1", (rectBB.x + rectBB.width/2).toFixed(1));
            crosshair.setAttribute("x2", (rectBB.x + rectBB.width/2).toFixed(1));
            crosshair.style.opacity = 1;
          }
          markers.forEach(function(m){ m.style.opacity = (parseInt(m.getAttribute("data-i"),10)===idx) ? 1 : 0; });
        });
        hr.addEventListener("mouseleave", function(){
          hideTip();
          if (crosshair) crosshair.style.opacity = 0;
          markers.forEach(function(m){ m.style.opacity = 0; });
        });
        hr.addEventListener("touchstart", function(evt){
          var payload = JSON.parse(hr.getAttribute("data-payload"));
          var touch = evt.touches[0];
          showTip({clientX:touch.clientX, clientY:touch.clientY}, payload);
        }, {passive:true});
      });
    });
  }

  // Captura ANTES de qualquer handler de clique rodar (fase de captura roda
  // primeiro, de fora pra dentro) — só grava onde o clique realmente
  // começou, sem mudar estado nem re-renderizar aqui. Precisa disso porque
  // o handler do próprio botão (fase de bubble) chama render() e substitui
  // o HTML todo; se a checagem de "clicou fora" rodasse depois disso
  // (.closest() no e.target já órfão), nunca encontrava o ancestral — o
  // menu fechava no mesmo clique que devia abrir (no PC passava batido
  // porque o hover ainda mostrava o flyout por cima; no mobile, sem hover,
  // nunca abria de verdade).
  var lastClickInsideOpDropdown = false, lastClickInsideNavGroup = false;
  document.addEventListener("click", function(e){
    lastClickInsideOpDropdown = !!(e.target.closest && e.target.closest(".op-filter-wrap"));
    lastClickInsideNavGroup = !!(e.target.closest && e.target.closest(".nav-group-item"));
  }, true);
  document.addEventListener("click", function(e){
    var changed = false;
    if (state.opDropdown !== null && !lastClickInsideOpDropdown){ state.opDropdown = null; changed = true; }
    if (state.navExpanded !== null && !lastClickInsideNavGroup){ state.navExpanded = null; changed = true; }
    if (changed) render();
  });

  if (!sb){
    document.getElementById("root").innerHTML = '<div style="padding:40px;text-align:center;color:#a33;font-family:sans-serif;">Não foi possível conectar ao banco de dados (Supabase). Verifique sua conexão e recarregue a página.</div>';
  } else {
    document.getElementById("root").innerHTML = '<div style="padding:40px;text-align:center;color:#666;font-family:sans-serif;">Carregando dados...</div>';
    Promise.all([
      carregarInsumos(), carregarInsumoMovs(), carregarFaqs(), carregarMips(),
      carregarFullEmpresas(), carregarFulls(), carregarUsuarios()
    ]).then(function(){
      render();
      subscribeTable("insumos", function(){ carregarInsumos().then(render); });
      subscribeTable("insumo_movs", function(){ carregarInsumoMovs().then(render); });
      subscribeTable("faqs", function(){ carregarFaqs().then(render); });
      subscribeTable("mips", function(){ carregarMips().then(render); });
      subscribeTable("mip_anexos", function(){ carregarMips().then(render); });
      subscribeTable("full_empresas", function(){ carregarFullEmpresas().then(render); });
      subscribeTable("fulls", function(){ carregarFulls().then(render); });
      subscribeTable("usuarios", function(){ carregarUsuarios().then(render); });
      // Sincroniza sozinho, ao abrir a página, as conexões do tipo "planilha
      // Google" (link público, quase nunca falha) — assim qualquer pessoa
      // que abra o link já vê os dados reais sem precisar clicar em
      // "Sincronizar" manualmente. Conexões do tipo "API" (ex.: Recebimento,
      // que depende do servidor do Glog rodando em localhost) ficam de fora
      // de propósito — sincronizar sozinho aqui só geraria erro de rede pra
      // quem não tem esse servidor local.
      CONNECTIONS.filter(function(c){ return c.tipo === "sheets"; }).forEach(function(conn){
        doSyncConnection(conn).then(function(){ saveConnections(); render(); });
      });
    }).catch(function(err){
      console.error("Falha ao carregar dados iniciais:", err);
      document.getElementById("root").innerHTML = '<div style="padding:40px;text-align:center;color:#a33;font-family:sans-serif;">Falha ao carregar dados: ' + (err && err.message ? err.message : err) + '</div>';
    });
  }
})();
</script>
</body>
</html>
