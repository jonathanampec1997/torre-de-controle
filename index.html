            }).join("") +
          '</div>' +
          '<div class="form-grid">' +
            '<div class="form-field"><label>' + (md.tipo==="ajustar" ? "Nova quantidade total" : (md.tipo==="debitar" ? "Quantidade usada" : "Quantidade recebida")) + '</label>' +
              '<input type="text" inputmode="numeric" data-insumo-mov-field="valor" value="' + escAttr(md.valor) + '" placeholder="' + (md.tipo==="ajustar"?"Ex.: 250":"Ex.: 50") + '"></div>' +
          '</div>' +
          (state.insumoMovError ? '<div class="conn-error" style="margin-top:12px;">' + state.insumoMovError + '</div>' : '') +
          '<div class="btn-row" style="margin-top:12px;">' +
            '<button class="btn-primary" data-insumo-mov-save>Confirmar</button>' +
            '<button class="btn-ghost" data-insumo-mov-cancel>Cancelar</button>' +
          '</div>' +
        '</div></td></tr>';
      }
      return row;
    }).join("");

    var listCard = '<div class="card">' +
      '<div class="card-head"><span class="card-title">Insumos cadastrados</span>' +
        (!draft ? '<button class="btn-primary" data-insumo-new>+ Novo insumo</button>' : '') +
      '</div>' +
      (INSUMOS.length ?
        '<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Categoria</th><th>Fornecedor</th><th>Estoque</th><th>Valor unitário</th><th>Ações</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="conn-empty"><div style="font-size:1.6rem;">◇</div><div>Nenhum insumo cadastrado ainda.</div></div>'
      ) +
      (state.insumoError ? '<div class="conn-error" style="margin-top:12px;">' + state.insumoError + '</div>' : '') +
    '</div>';

    var formCard = "";
    if (draft){
      formCard = '<div class="card">' +
        '<div class="card-head"><span class="card-title">' + (draft.id ? "Editar insumo" : "Novo insumo") + '</span>' +
          '<button class="btn-ghost" data-insumo-cancel>Cancelar</button>' +
        '</div>' +
        '<div class="form-grid">' +
          '<div class="form-field"><label>Nome</label><input type="text" data-insumo-field="nome" value="' + escAttr(draft.nome) + '" placeholder="Ex.: Caixa de papelão M"></div>' +
          '<div class="form-field"><label>Categoria</label><input type="text" data-insumo-field="categoria" value="' + escAttr(draft.categoria) + '" placeholder="Ex.: Embalagem"></div>' +
          '<div class="form-field"><label>Fornecedor — opcional</label><input type="text" data-insumo-field="fornecedor" value="' + escAttr(draft.fornecedor) + '"></div>' +
          '<div class="form-field"><label>Quantidade em estoque</label><input type="text" inputmode="numeric" data-insumo-field="estoque" value="' + escAttr(draft.estoque) + '"></div>' +
          '<div class="form-field"><label>Estoque mínimo — opcional</label><input type="text" inputmode="numeric" data-insumo-field="estoqueMinimo" value="' + escAttr(draft.estoqueMinimo) + '" placeholder="Ex.: 500"></div>' +
          '<div class="form-field"><label>Valor unitário (R$)</label><input type="text" inputmode="decimal" data-insumo-field="valorUnitario" value="' + escAttr(draft.valorUnitario) + '"></div>' +
          '<div class="form-field"><label>Unidade</label><select data-insumo-field="unidade">' +
            ["un","m","kg","rolo","par"].map(function(u){ return '<option value="' + u + '"' + (draft.unidade===u?" selected":"") + '>' + u + '</option>'; }).join("") +
          '</select></div>' +
          '<div class="form-field span2"><label>Observação — opcional</label><input type="text" data-insumo-field="observacao" value="' + escAttr(draft.observacao) + '" placeholder="Ex.: cx c/ 72un"></div>' +
        '</div>' +
        '<div class="btn-row" style="margin-top:14px;"><button class="btn-primary" data-insumo-save>Salvar</button></div>' +
      '</div>';
    }

    /* ---- Insumos por produto (SKU) ---- */
    var skuRows = SKUS.map(function(s){
      var vinculos = SKU_INSUMO_MAP[s.codigo] || [];
      var isEditing = state.skuInsumoEdit === s.codigo;
      var resumo = vinculos.length
        ? vinculos.map(function(v){
            var ins = INSUMOS.filter(function(i){return i.id===v.insumoId;})[0];
            return ins ? (ins.nome + " × " + fmtDec(v.qtd,2)) : null;
          }).filter(Boolean).join(", ") || '<span style="color:var(--ink-3);">nenhum insumo vinculado</span>'
        : '<span style="color:var(--ink-3);">nenhum insumo vinculado</span>';

      var row = '<tr>' +
        '<td class="mono">' + s.codigo + '</td>' +
        '<td>' + s.nome + '</td>' +
        '<td>' + resumo + '</td>' +
        '<td><button class="btn-small" data-skuins-edit="' + s.codigo + '">' + (isEditing?"Fechar":"Editar") + '</button></td>' +
      '</tr>';

      if (!isEditing) return row;

      var draftRows = state.skuInsumoDraftRows || [];
      var editForm = '<tr><td colspan="4"><div class="card" style="margin:6px 0; box-shadow:none;">' +
        '<div class="mini-table-title">Insumos usados por unidade embalada de ' + s.codigo + '</div>' +
        draftRows.map(function(r, ri){
          return '<div class="mapping-row" style="grid-template-columns:1.4fr .7fr auto;">' +
            '<select data-skuins-row-field="insumoId" data-skuins-row="' + ri + '">' +
              '<option value="">— escolher insumo —</option>' +
              INSUMOS.map(function(ins){ return '<option value="' + ins.id + '"' + (r.insumoId===ins.id?" selected":"") + '>' + ins.nome + '</option>'; }).join("") +
            '</select>' +
            '<input type="text" inputmode="decimal" data-skuins-row-field="qtd" data-skuins-row="' + ri + '" value="' + escAttr(r.qtd) + '" placeholder="Qtd./un.">' +
            '<button class="btn-danger" data-skuins-row-remove="' + ri + '">Remover</button>' +
          '</div>';
        }).join("") +
        '<div class="btn-row" style="margin-top:10px;">' +
          '<button class="btn-ghost" data-skuins-row-add>+ Adicionar insumo</button>' +
          '<button class="btn-primary" data-skuins-save="' + s.codigo + '">Salvar vínculos</button>' +
          '<button class="btn-ghost" data-skuins-cancel>Cancelar</button>' +
        '</div>' +
      '</div></td></tr>';

      return row + editForm;
    }).join("");

    var skuInsumoCard = '<div class="card">' +
      '<div class="card-head"><span class="card-title">Insumos por produto (SKU)</span></div>' +
      '<div class="desc" style="margin-bottom:8px;">Quais insumos cada produto usa por unidade embalada — alimenta o cálculo automático de custo de insumos na aba Financeiro (Outbound).</div>' +
      '<div class="table-wrap"><table><thead><tr><th>SKU</th><th>Descrição</th><th>Insumos vinculados</th><th>Ações</th></tr></thead><tbody>' + skuRows + '</tbody></table></div>' +
    '</div>';

    /* ---- Relatório de uso (a partir das movimentações registradas) ---- */
    function insumoPresetRange(n){
      var end = TODAY;
      var start = new Date(end.getFullYear(), end.getMonth(), end.getDate()-(n-1));
      return {start:isoDate(start), end:isoDate(end)};
    }
    function insumoPeriodSelector(){
      return '<div class="filter-field">' +
        '<span class="fl">Período</span>' +
        '<div class="date-range">' +
          '<div class="segmented" data-group="insumo-period">' +
            [7,15,30].map(function(p){
              var r = insumoPresetRange(p);
              var active = (state.insumoRelStart===r.start && state.insumoRelEnd===r.end);
              return '<button class="' + (active?"active":"") + '" data-insumo-period="' + p + '">' + p + ' dias</button>';
            }).join("") +
          '</div>' +
          '<span>de</span>' +
          '<input class="date-input" type="date" data-insumo-date="start" value="' + state.insumoRelStart + '">' +
          '<span>até</span>' +
          '<input class="date-input" type="date" data-insumo-date="end" value="' + state.insumoRelEnd + '">' +
        '</div>' +
      '</div>';
    }
    var relStart = state.insumoRelStart, relEnd = state.insumoRelEnd;
    var movsNoPeriodo = INSUMO_MOVS.filter(function(m){
      var diaISO = m.quando.slice(0,10);
      return diaISO >= relStart && diaISO <= relEnd;
    });
    var usoPorInsumo = {};
    movsNoPeriodo.forEach(function(m){
      if (!usoPorInsumo[m.insumoId]) usoPorInsumo[m.insumoId] = {usado:0, recebido:0};
      // "ajustar" é só correção manual (contagem física, erro de digitação) —
      // não é uso nem recebimento de verdade, então não entra na soma do
      // relatório (mas continua aparecendo no histórico bruto, pra auditoria).
      if (m.tipo === "debitar") usoPorInsumo[m.insumoId].usado += m.valor;
      else if (m.tipo === "adicionar") usoPorInsumo[m.insumoId].recebido += m.valor;
    });
    var relatorioRows = INSUMOS.map(function(ins){
      var u = usoPorInsumo[ins.id] || {usado:0, recebido:0};
      return {ins:ins, usado:u.usado, recebido:u.recebido};
    }).sort(function(a,b){ return b.usado - a.usado; });

    var relatorioTable = '<div class="table-wrap"><table><thead><tr><th>Insumo</th><th>Usado no período</th><th>Recebido no período</th><th>Valor gasto</th></tr></thead><tbody>' +
      (relatorioRows.length ? relatorioRows.map(function(r){
        var valorGasto = r.ins.valorUnitario > 0 ? fmtBRL(r.usado * r.ins.valorUnitario) : "—";
        return '<tr><td>' + escHtml(r.ins.nome) + '</td><td class="num">' + fmtInt(r.usado) + ' ' + escHtml(r.ins.unidade) + '</td><td class="num">' + fmtInt(r.recebido) + ' ' + escHtml(r.ins.unidade) + '</td><td class="num">' + valorGasto + '</td></tr>';
      }).join("") : '<tr><td colspan="4" style="color:var(--ink-3);">Nenhum insumo cadastrado.</td></tr>') +
    '</tbody></table></div>';

    var historicoRows = movsNoPeriodo.slice().sort(function(a,b){ return new Date(b.quando) - new Date(a.quando); });
    var historicoTable = '<div class="table-wrap"><table><thead><tr><th>Data/Hora</th><th>Insumo</th><th>Tipo</th><th>Quantidade</th><th>Estoque antes → depois</th><th>Ações</th></tr></thead><tbody>' +
      (historicoRows.length ? historicoRows.map(function(m){
        var insH = insumoById(m.insumoId);
        return '<tr><td class="mono">' + fmtDateTime(m.quando) + '</td><td>' + escHtml(insH?insH.nome:"—") + '</td><td>' + insumoMovTipoLabel(m.tipo) + '</td><td class="num">' + fmtInt(m.valor) + '</td><td class="num">' + fmtInt(m.estoqueAntes) + ' → ' + fmtInt(m.estoqueDepois) + '</td>' +
          '<td><button class="btn-danger" data-insumomov-remove="' + m.id + '" title="Remove o registro do histórico. Se for a movimentação mais recente do insumo, também desfaz o efeito no estoque atual.">Remover</button></td></tr>';
      }).join("") : '<tr><td colspan="6" style="color:var(--ink-3);">Nenhuma movimentação nesse período.</td></tr>') +
    '</tbody></table></div>';

    var relatorioCard = '<div class="card">' +
      '<div class="card-head"><span class="card-title">Relatório de uso de insumos</span></div>' +
      '<div class="desc" style="margin-bottom:8px;">Baseado nas movimentações (adicionar/debitar/ajustar) registradas com data e hora.</div>' +
      '<div class="filters" style="margin-bottom:10px;">' + insumoPeriodSelector() + '</div>' +
      '<div class="mini-table-title">Consumo por insumo no período</div>' +
      relatorioTable +
      '<div class="mini-table-title" style="margin-top:16px;">Histórico de movimentações</div>' +
      historicoTable +
    '</div>';

    return '' +
    '<div class="topbar"><div><h1>Insumos</h1><p>Cadastro de materiais de embalagem e logística, e vínculo com os produtos que os utilizam.</p></div></div>' +
    '<div class="content">' +
      '<section class="sector">' + listCard + formCard + '</section>' +
      '<section class="sector">' + skuInsumoCard + '</section>' +
      '<section class="sector">' + relatorioCard + '</section>' +
    '</div>';
  }

  /* ============================ PAGE: VISÃO GERAL ============================ */

  function pageGeral(){
    var cur = windowData(0);
    var prev = windowData(1);

    var totalNFsCur = sum(cur, function(d){return d.totalNFs;});
    var totalNFsPrev = sum(prev, function(d){return d.totalNFs;});

    var totalMovCur = sum(cur, function(d){return d.totalUnidades + d.armazenagem.unidades + d.abastecimento.unidades;});
    var totalMovPrev = sum(prev, function(d){return d.totalUnidades + d.armazenagem.unidades + d.abastecimento.unidades;});

    var prodMediaCur = avg(cur, function(d){return (d.armazenagem.produtividade + d.abastecimento.produtividade)/2;});
    var prodMediaPrev = avg(prev, function(d){return (d.armazenagem.produtividade + d.abastecimento.produtividade)/2;});

    function tempoConfMedio(arr){
      var totalW = sum(arr, function(d){ return d.totalVolumes; });
      if (!totalW) return 0;
      return sum(arr, function(d){
        return sum(EMPRESAS, function(e){ return d.empresas[e.id].tempoConf * d.empresas[e.id].volumes; });
      }) / totalW;
    }
    var tempoConfCur = tempoConfMedio(cur);
    var tempoConfPrev = tempoConfMedio(prev);

    var kpis = [
      kpiCard("NFs recebidas no período", fmtInt(totalNFsCur), "", totalNFsCur, totalNFsPrev, "neutral",
        cur.map(function(d){return d.totalNFs;}), "var(--ink-3)"),
      kpiCard("Unidades movimentadas", fmtInt(totalMovCur), "", totalMovCur, totalMovPrev, "neutral",
        cur.map(function(d){return d.totalUnidades+d.armazenagem.unidades+d.abastecimento.unidades;}), "var(--ink-3)"),
      kpiCard("Produtividade média da operação", fmtDec(prodMediaCur,0), "un/h", prodMediaCur, prodMediaPrev, "higher-better",
        cur.map(function(d){return (d.armazenagem.produtividade+d.abastecimento.produtividade)/2;}), "var(--accent)"),
      kpiCard("Tempo médio de conferência", fmtDuracaoParts(tempoConfCur).value, fmtDuracaoParts(tempoConfCur).unit + "/nota", tempoConfCur, tempoConfPrev, "lower-better",
        cur.map(function(d){ var tw=sum(EMPRESAS,function(e){return d.empresas[e.id].tempoConf*d.empresas[e.id].volumes;}); return d.totalVolumes? tw/d.totalVolumes : 0; }), "var(--accent)")
    ];

    var chart = areaLineChart("geral-total", cur, function(d){ return d.totalUnidades + d.armazenagem.unidades + d.abastecimento.unidades; }, "var(--accent)", "un");

    /* ---- Indicadores executivos (qualidade, risco de coleta, custo) ---- */
    function ocorrenciasQualidade(arr){
      return sum(arr, function(d){
        return sum(EMPRESAS, function(e){ return d.empresas[e.id].avarias + d.empresas[e.id].divergencias; }) +
          sum(PLATAFORMAS, function(p){ return d.plataformas[p.id].errosSeparacao + d.plataformas[p.id].retrabalho; });
      });
    }
    var ocorrenciasCur = ocorrenciasQualidade(cur);
    var ocorrenciasPrev = ocorrenciasQualidade(prev);

    function tempoEmbGlobal(arr){
      var tw = sum(arr, function(d){ return sum(PLATAFORMAS, function(p){ return d.plataformas[p.id].tempoEmb * d.plataformas[p.id].embalados; }); });
      var vw = sum(arr, function(d){ return sum(PLATAFORMAS, function(p){ return d.plataformas[p.id].embalados; }); });
      return vw ? tw/vw : 0;
    }
    var tEmbGlobalCur = tempoEmbGlobal(cur);
    var prodEmbGlobalCur = tEmbGlobalCur ? 60/tEmbGlobalCur : 0;
    var pendentesHojeGeral = AGENDA_COLETA.filter(function(r){return r.status==="pendente";});
    var riscosAtivos = pendentesHojeGeral.filter(function(r){
      var minutosRestantes = hhmmToMin(r.corte) - hhmmToMin(AGORA_HHMM);
      var tempoNecessario = prodEmbGlobalCur ? (r.pendentesEmbalagem / prodEmbGlobalCur * 60) : 0;
      return minutosRestantes <= 0 || tempoNecessario >= minutosRestantes;
    }).length;

    function custoMaoDeObraGlobal(day){
      return sum(PLATAFORMAS, function(p){
        var pv = day.plataformas[p.id];
        return (pv.tempoSep*pv.separados + pv.tempoEmb*pv.embalados) / 60 * CUSTO_HORA_OPERADOR;
      });
    }
    function custoColetaGlobal(arr){
      var emb = sum(arr, function(d){return sum(PLATAFORMAS, function(p){return d.plataformas[p.id].embalados;});});
      var naoColet = sum(arr, function(d){return sum(PLATAFORMAS, function(p){return d.plataformas[p.id].naoColetados;});});
      return (emb-naoColet) * CUSTO_COLETA_MEDIO;
    }
    var custoTotalCur = sum(cur, custoMaoDeObraGlobal) + custoColetaGlobal(cur);
    var custoTotalPrev = sum(prev, custoMaoDeObraGlobal) + custoColetaGlobal(prev);

    var execKpis = [
      kpiCard("Ocorrências de qualidade no período", fmtInt(ocorrenciasCur), "", ocorrenciasCur, ocorrenciasPrev, "lower-better", null, "var(--accent)",
        '<div style="color:var(--ink-3); font-size:.72rem; margin-top:2px;">avarias + erros + retrabalho</div>'),
      snapshotCard("Coletas em risco de atraso hoje", fmtInt(riscosAtivos), "de " + pendentesHojeGeral.length + " pendentes", "agora: " + AGORA_HHMM),
      kpiCard("Custo logístico estimado no período", fmtBRL(custoTotalCur), "", custoTotalCur, custoTotalPrev, "lower-better", null, "var(--accent)",
        '<div style="color:var(--ink-3); font-size:.72rem; margin-top:2px;">mão de obra + coleta</div>')
    ];

    var inboundNFs = totalNFsCur;
    var inboundProd = Math.round(avg(cur, function(d){return d.armazenagem.produtividade;}));
    var outboundSep = sum(cur, function(d){return d.totalSeparados;});
    var outboundColetaPct = (function(){
      var emb = sum(cur, function(d){return d.totalEmbalados;});
      var naoColet = sum(cur, function(d){ return sum(PLATAFORMAS, function(p){return d.plataformas[p.id].naoColetados;}); });
      return emb ? (1 - naoColet/emb) * 100 : 0;
    })();

    return '' +
    '<div class="topbar">' +
      '<div><h1>Visão Geral</h1><p>Panorama consolidado da operação do galpão — Ampec, EDN e Mapec.</p></div>' +
      '<div class="filters">' + periodSelector() + '</div>' +
    '</div>' +
    '<div class="content">' +
      '<div class="banner-demo">● dados fictícios para prototipação — conecte o banco de dados quando estiver pronto</div>' +
      '<section class="sector">' +
        '<div class="kpi-grid">' + kpis.join("") + '</div>' +
      '</section>' +
      '<section class="sector">' +
        '<div class="sector-head"><h2>Indicadores executivos</h2><div class="desc">Visão consolidada de qualidade, risco de coleta e custo logístico — Inbound e Outbound juntos.</div></div>' +
        '<div class="kpi-grid">' + execKpis.join("") + '</div>' +
      '</section>' +
      '<section class="sector">' +
        '<div class="card">' +
          '<div class="card-head"><div class="card-title">Unidades processadas por dia — total do galpão</div></div>' +
          chart +
        '</div>' +
      '</section>' +
      '<section class="sector">' +
        '<div class="sector-head"><h2>Setores</h2></div>' +
        '<div class="sector-cards">' +
          '<button class="sector-card" data-nav="inbound">' +
            '<div class="row1"><h3>Inbound</h3><span class="chip live">ativo</span></div>' +
            '<div class="procs">Recebimento · Armazenagem · Abastecimento</div>' +
            '<div class="mini-kpis">' +
              '<div><span class="v mono">' + fmtInt(inboundNFs) + '</span><span class="l">NFs no período</span></div>' +
              '<div><span class="v mono">' + fmtInt(inboundProd) + '</span><span class="l">un/h armazenagem</span></div>' +
            '</div>' +
          '</button>' +
          '<button class="sector-card" data-nav="outbound">' +
            '<div class="row1"><h3>Outbound</h3><span class="chip live">ativo</span></div>' +
            '<div class="procs">Separação · Embalagem · Coletas</div>' +
            '<div class="mini-kpis">' +
              '<div><span class="v mono">' + fmtInt(outboundSep) + '</span><span class="l">pedidos separados</span></div>' +
              '<div><span class="v mono">' + fmtDec(outboundColetaPct,0) + '%</span><span class="l">coletado no período</span></div>' +
            '</div>' +
          '</button>' +
        '</div>' +
      '</section>' +
      tinyOutboundWidgetShell() +
    '</div>';
  }

  /* ==================== TINY OUTBOUND WIDGET (ao vivo, Visão Geral) ==================== */
  // Widget separado do resto da Visão Geral, de propósito: busca direto do
  // backend do Glog (`http://localhost:3000/api/tiny/outbound-hoje`, ver
  // `glog/src/lib/tiny.ts` + `tiny-outbound-snapshot.ts`) e se atualiza
  // sozinho a cada 5min — SEM passar pelo render()/state global. Motivo:
  // render() reconstrói o DOM inteiro (ver convenções no HANDOFF), o que
  // perderia foco de qualquer campo de texto que o usuário esteja
  // preenchendo em outro lugar da tela no momento em que o refresh de
  // 5min disparasse. Igual à exceção já existente da busca de SKU
  // (`data-sku-filter`): manipula o DOM direto, nunca chama render().
  //
  // Depende do servidor do Glog rodando local (`npm run dev` dentro de
  // `glog/`, ou `start-glog.bat`) — mesma limitação já conhecida da
  // conexão "Recebimento — WMS E-ship". Sem ele, mostra um aviso em vez
  // de travar o resto da página.
  var tinyOutboundFetching = false;

  // Converte a linha do Supabase (snake_case) pro formato que
  // renderTinyOutboundWidget espera (mesmo shape que a rota /api/tiny/
  // outbound-hoje sempre devolveu). Ler daqui (em vez de chamar o Glog
  // direto em localhost) é o que permite qualquer pessoa com o link ver
  // os mesmos dados — só o Glog, rodando no PC de quem cadastrou o token,
  // precisa alcançar o Tiny; todo mundo lê o resultado já pronto aqui.
  function tinyOutboundRowParaWidget(row){
    return {
      pendenteTotal: row.pendente_total,
      pendentePorFormaEnvio: row.pendente_por_forma_envio || {},
      embaladoTotal: row.embalado_total,
      embaladoPorFormaEnvio: row.embalado_por_forma_envio || {},
      embaladoPorEmbalador: row.embalado_por_embalador || {},
      embaladoSemEmbaladorIdentificado: row.embalado_sem_embalador_identificado || 0,
      tabelaEmbaladorPorForma: row.tabela_embalador_por_forma || {},
      aprovadosPorHoraPR: row.aprovados_por_hora_pr || {},
      aprovadosPorHoraEDN: row.aprovados_por_hora_edn || {},
      atualizadoEm: row.atualizado_em,
    };
  }

  function tinyOutboundWidgetShell(){
    return '<section class="sector">' +
      '<div class="sector-head"><h2>Outbound — Tiny ERP (hoje, ao vivo)</h2>' +
        '<div class="desc">Fila atual pra embalar e embalados de hoje, direto do Tiny — atualiza sozinho a cada poucos minutos. Depende do Glog rodando local.</div>' +
      '</div>' +
      '<div id="tiny-outbound-widget"><div class="banner-demo">Carregando dados do Tiny…</div></div>' +
    '</section>';
  }

  function renderTinyOutboundError(msg){
    return '<div class="banner-demo" style="border-color:var(--status-critical); color:var(--status-critical);">' +
      '⚠ Não consegui buscar dados do Tiny agora: ' + escHtml(msg) + '. ' +
      'Confira se o servidor do Glog está rodando (<code>start-glog.bat</code>, ou <code>npm run dev</code> dentro de <code>glog/</code>).' +
    '</div>';
  }

  function tinyBarList(map){
    var entries = Object.keys(map).map(function(k){ return [k, map[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    if (!entries.length) return '<p style="color:var(--ink-3); font-size:.85rem;">Nenhum pedido.</p>';
    var max = Math.max.apply(null, entries.map(function(e){ return e[1]; }));
    return entries.map(function(e){
      var pct = max ? (e[1]/max*100) : 0;
      return '<div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">' +
        '<div style="width:150px; flex-shrink:0; font-size:.8rem; color:var(--ink-2);">' + escHtml(e[0]) + '</div>' +
        '<div style="flex:1; height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden;">' +
          '<div style="height:100%; width:' + pct.toFixed(0) + '%; background:var(--accent); border-radius:4px;"></div>' +
        '</div>' +
        '<div style="width:48px; text-align:right; font-family:\'IBM Plex Mono\',monospace; font-size:.8rem;">' + fmtInt(e[1]) + '</div>' +
      '</div>';
    }).join("");
  }

  function renderTinyOutboundWidget(d){
    var kpis = [
      snapshotCard("Pedidos a embalar (fila atual)", fmtInt(d.pendenteTotal), "", "independente de quando o pedido foi criado"),
      snapshotCard("Pedidos embalados hoje", fmtInt(d.embaladoTotal), "", "atualizado às " + new Date(d.atualizadoEm).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}))
    ];

    var embaladorNota = d.embaladoSemEmbaladorIdentificado > 0
      ? '<p style="color:var(--ink-3); font-size:.78rem; margin-top:6px;">' + fmtInt(d.embaladoSemEmbaladorIdentificado) + ' pedido(s) ainda sem embalador identificado (completando aos poucos a cada atualização).</p>'
      : "";

    var formasTabela = (function(){
      var formas = {};
      Object.keys(d.embaladoPorFormaEnvio).forEach(function(f){ formas[f] = 1; });
      Object.keys(d.tabelaEmbaladorPorForma).forEach(function(emb){
        Object.keys(d.tabelaEmbaladorPorForma[emb]).forEach(function(f){ formas[f] = 1; });
      });
      var formaList = Object.keys(formas).sort();
      var embaladores = Object.keys(d.embaladoPorEmbalador).sort(function(a,b){ return d.embaladoPorEmbalador[b]-d.embaladoPorEmbalador[a]; });
      if (!embaladores.length || !formaList.length) return "";
      var header = '<tr><th>Embalador</th>' + formaList.map(function(f){ return '<th class="num">' + escHtml(f) + '</th>'; }).join("") + '<th class="num">Total</th></tr>';
      var rows = embaladores.map(function(emb){
        var linha = d.tabelaEmbaladorPorForma[emb] || {};
        var cells = formaList.map(function(f){ return '<td class="num">' + fmtInt(linha[f]||0) + '</td>'; }).join("");
        return '<tr><td>' + escHtml(emb) + '</td>' + cells + '<td class="num"><strong>' + fmtInt(d.embaladoPorEmbalador[emb]) + '</strong></td></tr>';
      }).join("");
      return '<div class="card" style="margin-top:16px;"><div class="card-head"><div class="card-title">Embalados hoje — embalador × forma de envio</div></div>' +
        '<div class="table-wrap"><table><thead>' + header + '</thead><tbody>' + rows + '</tbody></table></div></div>';
    })();

    var horas = [];
    for (var h = 0; h < 24; h++) horas.push(h);
    function matrizDe(porHora){ return [horas.map(function(h2){ return porHora[String(h2)] || 0; })]; }
    var matrizPR = matrizDe(d.aprovadosPorHoraPR);
    var matrizEDN = matrizDe(d.aprovadosPorHoraEDN);
    var temAprovadosPR = matrizPR[0].some(function(v){ return v > 0; });
    var temAprovadosEDN = matrizEDN[0].some(function(v){ return v > 0; });
    var semDadosMsg = '<p style="color:var(--ink-3); font-size:.85rem;">Ainda sem dados suficientes — precisa de pelo menos 2 consultas (uns 5min) pra calcular a diferença.</p>';

    return '' +
      '<div class="kpi-grid">' + kpis.join("") + '</div>' +
      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;">' +
        '<div class="card"><div class="card-head"><div class="card-title">A embalar por forma de envio</div></div>' + tinyBarList(d.pendentePorFormaEnvio) + '</div>' +
        '<div class="card"><div class="card-head"><div class="card-title">Embalados hoje por forma de envio</div></div>' + tinyBarList(d.embaladoPorFormaEnvio) + '</div>' +
      '</div>' +
      '<div class="card" style="margin-top:16px;"><div class="card-head"><div class="card-title">Embalados hoje por usuário</div></div>' +
        tinyBarList(d.embaladoPorEmbalador) + embaladorNota +
      '</div>' +
      formasTabela +
      '<div class="card" style="margin-top:16px;"><div class="card-head"><div class="card-title">Horário de pico de aprovação — Ampec PR</div><div class="desc">Quantos pedidos foram aprovados a cada hora, acumulado desde a primeira consulta de hoje.</div></div>' +
        (temAprovadosPR
          ? heatmapChart("tiny-aprovados-hora-pr", matrizPR, horas, ["Hoje"]) + heatmapLegend()
          : semDadosMsg) +
      '</div>' +
      '<div class="card" style="margin-top:16px;"><div class="card-head"><div class="card-title">Horário de pico de aprovação — Ampec SC EDN</div><div class="desc">Quantos pedidos foram aprovados a cada hora, acumulado desde a primeira consulta de hoje.</div></div>' +
        (temAprovadosEDN
          ? heatmapChart("tiny-aprovados-hora-edn", matrizEDN, horas, ["Hoje"]) + heatmapLegend()
          : semDadosMsg) +
      '</div>';
  }

  function refreshTinyOutbound(){
    if (tinyOutboundFetching) return;
    var el = document.getElementById("tiny-outbound-widget");
    if (!el) return; // não estamos na Visão Geral agora
    if (!sb) { el.innerHTML = renderTinyOutboundError("Não foi possível conectar ao banco de dados (Supabase)."); return; }
    tinyOutboundFetching = true;
    sb.from("tiny_outbound_snapshot").select("*").eq("id", "atual").maybeSingle()
      .then(function(res){
        if (res.error) throw new Error(res.error.message);
        if (!res.data) throw new Error("Ainda sem nenhum dado salvo — aguarde o Glog rodar a primeira consulta.");
        var target = document.getElementById("tiny-outbound-widget");
        if (target) {
          target.innerHTML = renderTinyOutboundWidget(tinyOutboundRowParaWidget(res.data));
          wireChartTooltips(target);
        }
      })
      .catch(function(err){
        var target = document.getElementById("tiny-outbound-widget");
        if (target) target.innerHTML = renderTinyOutboundError(err && err.message ? err.message : String(err));
      })
      .then(function(){ tinyOutboundFetching = false; }, function(){ tinyOutboundFetching = false; });
  }

  if (!window.__tinyOutboundIntervalStarted){
    window.__tinyOutboundIntervalStarted = true;
    setInterval(refreshTinyOutbound, 5*60*1000);
  }

  /* ============================ PAGE: INBOUND ============================ */

  function empresaFilterList(){
    return state.empresa === "todas" ? EMPRESAS.map(function(e){return e.id;}) : [state.empresa];
  }

  function opFactorIn(day){
    if (state.operadorIn.length === 0) return 1;
    return sum(state.operadorIn, function(n){ return day.opInbound[n] || 0; });
  }

  function pageInbound(){
    var cur = windowData(0);
    var prev = windowData(1);
    var keys = empresaFilterList();

    /* ---- Recebimento ---- */
    function recBase(day, field){ return sum(keys, function(k){ return day.empresas[k][field]; }); }
    function recVal(day, field){ return opFactorIn(day) * recBase(day, field); }
    var nfsCur = sum(cur, function(d){return recVal(d,"nfs");});
    var nfsPrev = sum(prev, function(d){return recVal(d,"nfs");});
    var volCur = sum(cur, function(d){return recVal(d,"volumes");});
    var volPrev = sum(prev, function(d){return recVal(d,"volumes");});
    var unCur = sum(cur, function(d){return recVal(d,"unidades");});
    var unPrev = sum(prev, function(d){return recVal(d,"unidades");});

    function tempoConfWin(arr){
      var tw = sum(arr, function(d){ return sum(keys, function(k){ return d.empresas[k].tempoConf * d.empresas[k].volumes; }); });
      var vw = sum(arr, function(d){ return sum(keys, function(k){ return d.empresas[k].volumes; }); });
      return vw ? tw/vw : 0;
    }
    var tcCur = tempoConfWin(cur), tcPrev = tempoConfWin(prev);

    var recKpis = [
      kpiCard("QTD de NFs recebidas", fmtInt(nfsCur), "", nfsCur, nfsPrev, "neutral", cur.map(function(d){return recVal(d,"nfs");}), "var(--ink-3)",
        metaBadge(nfsCur/(cur.length||1), METAS.nfsDia, true, fmtInt(METAS.nfsDia) + "/dia")),
      kpiCard("QTD de volumes recebidos", fmtInt(volCur), "", volCur, volPrev, "neutral", cur.map(function(d){return recVal(d,"volumes");}), "var(--ink-3)"),
      kpiCard("QTD de unidades recebidas", fmtInt(unCur), "", unCur, unPrev, "neutral", cur.map(function(d){return recVal(d,"unidades");}), "var(--ink-3)"),
      kpiCard("Tempo médio de conferência", fmtDuracaoParts(tcCur).value, fmtDuracaoParts(tcCur).unit + "/nota", tcCur, tcPrev, "lower-better",
        cur.map(function(d){ var tw=sum(keys,function(k){return d.empresas[k].tempoConf*d.empresas[k].volumes;}); var vw=sum(keys,function(k){return d.empresas[k].volumes;}); return vw?tw/vw:0; }), "var(--accent)")
    ];

    /* ---- Qualidade do recebimento ---- */
    function qualBase(day, field){ return sum(keys, function(k){ return day.empresas[k][field]; }); }
    function qualVal(day, field){ return opFactorIn(day) * qualBase(day, field); }
    var avariasCur = sum(cur, function(d){return qualVal(d,"avarias");});
    var avariasPrev = sum(prev, function(d){return qualVal(d,"avarias");});
    var divergCur = sum(cur, function(d){return qualVal(d,"divergencias");});
    var divergPrev = sum(prev, function(d){return qualVal(d,"divergencias");});
    var taxaAvariaCur = volCur ? avariasCur/volCur*100 : 0;
    var taxaAvariaPrev = volPrev ? avariasPrev/volPrev*100 : 0;
    var taxaDivergCur = nfsCur ? divergCur/nfsCur*100 : 0;
    var taxaDivergPrev = nfsPrev ? divergPrev/nfsPrev*100 : 0;

    var qualKpis = [
      kpiCard("Avarias identificadas", fmtInt(avariasCur), "un", avariasCur, avariasPrev, "lower-better", cur.map(function(d){return qualVal(d,"avarias");}), "var(--accent)"),
      kpiCard("Taxa de avaria", fmtDec(taxaAvariaCur,2), "%", taxaAvariaCur, taxaAvariaPrev, "lower-better", null, "var(--accent)"),
      kpiCard("Divergências de NF", fmtInt(divergCur), "", divergCur, divergPrev, "lower-better", cur.map(function(d){return qualVal(d,"divergencias");}), "var(--accent)"),
      kpiCard("Taxa de divergência", fmtDec(taxaDivergCur,2), "%", taxaDivergCur, taxaDivergPrev, "lower-better", null, "var(--accent)")
    ];
    var qualResumo = '<div class="mini-table-title">Qualidade por empresa — período selecionado</div><div class="table-wrap"><table><thead><tr><th>Empresa</th><th>Avarias</th><th>Taxa de avaria</th><th>Divergências</th><th>Taxa de divergência</th></tr></thead><tbody>' +
      EMPRESAS.map(function(e){
        var av = sum(cur,function(d){return opFactorIn(d)*d.empresas[e.id].avarias;});
        var vo = sum(cur,function(d){return opFactorIn(d)*d.empresas[e.id].volumes;});

      }).join("") + '</tbody></table></div>';

    var recChart = keys.length > 1
      ? stackedBarChart("rec-nfs", cur, keys, function(d,k){ return d.empresas[k].nfs; })
      : barChart("rec-nfs", cur, function(d){ return d.empresas[keys[0]].nfs; }, empresaColor(keys[0]));

    var recTable = '<div class="table-wrap"><table><thead><tr><th>Data</th><th>NFs</th><th>Volumes</th><th>Unidades</th><th>Tempo médio</th></tr></thead><tbody>' +
      cur.slice().reverse().map(function(d){
        return '<tr><td>' + d.label + '</td><td class="num">' + fmtInt(recVal(d,"nfs")) + '</td><td class="num">' + fmtInt(recVal(d,"volumes")) + '</td><td class="num">' + fmtInt(recVal(d,"unidades")) + '</td><td class="num">' + fmtDuracao(sum(keys,function(k){return d.empresas[k].tempoConf*d.empresas[k].volumes;})/(sum(keys,function(k){return d.empresas[k].volumes;})||1)) + '</td></tr>';
      }).join("") + '</tbody></table></div>';

    var empresaResumo = '<div class="mini-table-title">Resumo por empresa — período selecionado</div><div class="table-wrap"><table><thead><tr><th>Empresa</th><th>NFs</th><th>Volumes</th><th>Unidades</th><th>Tempo médio conferência</th></tr></thead><tbody>' +
      EMPRESAS.map(function(e){
        var nfs = sum(cur,function(d){return opFactorIn(d)*d.empresas[e.id].nfs;});
        var vol = sum(cur,function(d){return opFactorIn(d)*d.empresas[e.id].volumes;});
        var un = sum(cur,function(d){return opFactorIn(d)*d.empresas[e.id].unidades;});

    /* ---- Armazenagem ---- */
    function armBase(day, field){

    var tarefasArmCur = sum(cur, function(d){return armProrated(d,"tarefas");});

    var unArmCur = sum(cur, function(d){return armProrated(d,"unidades");});
    var unArmPrev = sum(prev, function(d){return armProrated(d,"unidades");});

    var tempoArmPrev = avg(prev, function(d){return d.armazenagem.tempoMedio;});
    var prodArmCur = avg(cur, function(d){return d.armazenagem.produtividade;});
    var prodArmPrev = avg(prev, function(d){return d.armazenagem.produtividade;});

    var armKpis = [

    /* ---- Abastecimento ---- */
    function abastBase(day, field){

          : '<span class="pill pending">' + (n.status||"—") + '</span>';
        return '<tr data-sku-row="' + (n.id + " " + empresaNome(n.empresa) + " " + (n.usuario||"") + " " + (n.doc||"")).toLowerCase() + '">' +
          '<td class="mono">' + n.id + '</td>' +
          '<td><span class="dot" style="display:inline-block;margin-right:6px;background:' + empresaColor(n.empresa) + '"></span>' + empresaNome(n.empresa) + '</td>' +
          '<td>' + (n.doc||"—") + '</td>' +
          '<td>' + (n.usuario||"—") + '</td>' +
          '<td class="mono">' + eshipHora(n.inicio) + '</td>' +
          '<td class="mono">' + (n.horaFinalizado ? eshipHora(n.horaFinalizado) : "—") + '</td>' +
          '<td>' + statusPill + '</td></tr>';
      }).join("") + '</tbody></table></div>';

    var comparisonSection = "";
    if (state.operadorIn.length > 1){
      var compMetricsIn = [
        {label:"NFs recebidas", fn:function(day,name){ return (day.opInbound[name]||0) * recBase(day,"nfs"); }},
        {label:"Unid. armazenadas", fn:function(day,name){ return (day.opInbound[name]||0) * armBase(day,"unidades"); }},
        {label:"Unid. abastecidas", fn:function(day,name){ return (day.opInbound[name]||0) * abastBase(day,"unidades"); }},
        {label:"Avarias identificadas", fn:function(day,name){ return (day.opInbound[name]||0) * qualBase(day,"avarias"); }}
      ];
      comparisonSection = '<section class="sector">' +
        '<div class="sector-head"><h2>Comparativo entre operadores selecionados</h2><div class="desc">Volume individual no período — cada percentual mostra a diferença em relação à média do grupo selecionado.</div></div>' +
        '<div class="card">' + comparisonTable(state.operadorIn, cur, compMetricsIn) + '</div>' +
      '</section>';
    }

    var topbarFilters = '<div class="filters">' + empresaSelector() + operadorSelector("in") + periodSelector() + '</div>';

    var inventarioHtml =
      '<div class="topbar"><div><h1>Inbound · Inventário</h1><p>Ocupação do estoque e composição dos itens recebidos no período.</p></div>' + topbarFilters + '</div>' +
      '<div class="content">' +
        '<section class="sector"><div class="kpi-grid">' + inventarioKpis.join("") + '</div></section>' +
        '<section class="sector">' +
          '<div class="card">' +
            '<div class="card-head"><div class="card-title">Top SKUs recebidos no período</div>' + skuSearchBox("tbl-sku-rec") + '</div>' +
            skuTable +
          '</div>' +
        '</section>' +
      '</div>';

    var recebimentoHtml =
      '<div class="topbar"><div><h1>Inbound · Recebimento</h1><p>Entrada de notas fiscais e conferência de carga na doca.</p></div>' + topbarFilters + '</div>' +
      '<div class="content">' +
        comparisonSection +
        '<section class="sector">' +
          '<div class="sector-head"><h2>Recebimento</h2><div class="desc">Entrada de notas fiscais e conferência de carga na doca.</div>' + fonteBadge("recebimento") + '</div>' +
          '<div class="kpi-grid">' + recKpis.join("") + '</div>' +
          '<div class="card" data-view-card="rec-nfs">' +
            '<div class="card-head"><div class="card-title">NFs recebidas por dia' + (keys.length>1?' — por empresa':' — ' + empresaNome(keys[0])) + '</div>' +
              '<div class="toggle-view" data-toggle="rec-nfs"><button class="active" data-view="chart">Gráfico</button><button data-view="table">Tabela</button></div>' +
            '</div>' + recLegend +
            '<div data-pane="rec-nfs-chart">' + recChart + '</div>' +
            '<div data-pane="rec-nfs-table" hidden>' + recTable + '</div>' +
          '</div>' +
          '<div class="card">' + empresaResumo + '</div>' +
        '</section>' +
        '<section class="sector">' +
          '<div class="sector-head"><h2>Qualidade do recebimento</h2><div class="desc">Avarias identificadas na doca e divergências entre a nota fiscal e a carga física.</div></div>' +
          '<div class="kpi-grid">' + qualKpis.join("") + '</div>' +
          '<div class="card">' + qualResumo + '</div>' +
        '</section>' +
      '</div>';

    var armazenagemHtml =
      '<div class="topbar"><div><h1>Inbound · Armazenagem</h1><p>Endereçamento das unidades recebidas nas posições de estoque.</p></div>' + topbarFilters + '</div>' +
      '<div class="content">' +
        '<section class="sector">' +
          '<div class="sector-head"><h2>Armazenagem</h2><div class="desc">Endereçamento das unidades recebidas nas posições de estoque.</div>' + fonteBadge("armazenagem") + '</div>' +
          '<div class="kpi-grid">' + armKpis.join("") + '</div>' +
          '<div class="card" data-view-card="arm-prod">' +
            '<div class="card-head"><div class="card-title">Produtividade por dia (unidades/hora)</div>' +
              '<div class="toggle-view" data-toggle="arm-prod"><button class="active" data-view="chart">Gráfico</button><button data-view="table">Tabela</button></div>' +
            '</div>' +
            '<div data-pane="arm-prod-chart">' + armChart + '</div>' +
            '<div data-pane="arm-prod-table" hidden>' + armTable + '</div>' +
          '</div>' +
        '</section>' +
      '</div>';

    var abastecimentoHtml =
      '<div class="topbar"><div><h1>Inbound · Abastecimento</h1><p>Reposição das posições de picking a partir do estoque geral.</p></div>' + topbarFilters + '</div>' +
      '<div class="content">' +
        '<section class="sector">' +
          '<div class="sector-head"><h2>Abastecimento</h2><div class="desc">Reposição das posições de picking a partir do estoque geral.</div>' + fonteBadge("abastecimento") + '</div>' +
          '<div class="kpi-grid">' + abKpis.join("") + '</div>' +
          '<div class="card" data-view-card="ab-unidades">' +
            '<div class="card-head"><div class="card-title">Unidades abastecidas por dia</div>' +
              '<div class="toggle-view" data-toggle="ab-unidades"><button class="active" data-view="chart">Gráfico</button><button data-view="table">Tabela</button></div>' +
            '</div>' +
            '<div data-pane="ab-unidades-chart">' + abChart + '</div>' +
            '<div data-pane="ab-unidades-table" hidden>' + abTable + '</div>' +
          '</div>' +
        '</section>' +
      '</div>';

    var rastreabilidadeHtml =
      '<div class="topbar"><div><h1>Inbound · Rastreabilidade</h1><p>Linha do tempo de recebimento até a armazenagem.</p></div>' + topbarFilters + '</div>' +
      '<div class="content">' +
        '<section class="sector">' +
          '<div class="sector-head"><h2>Rastreabilidade</h2><div class="desc">Busque pelo número da NF ou pela empresa para ver a linha do tempo de recebimento até a armazenagem — últimos dias.</div></div>' +
          '<div class="card">' +
            '<div class="card-head"><div class="card-title">Notas fiscais recentes</div>' + skuSearchBox("tbl-track-in", "Buscar por NF ou empresa…") + '</div>' +
            notasTable +
          '</div>' +
        '</section>' +
      '</div>';

    var horariosHtml =
      '<div class="topbar"><div><h1>Inbound · Horários de Pico</h1><p>Em quais horários e dias da semana o processo mais acontece.</p></div>' + topbarFilters + '</div>' +
      '<div class="content">' +
        '<section class="sector">' +
          '<div class="sector-head"><h2>Horários de pico</h2><div class="desc">Em quais horários e dias da semana o processo mais acontece — período completo de 30 dias.</div></div>' +
          '<div class="card">' +
            '<div class="heat-controls">' + heatMetricSelector("in", heatOptionsIn, state.heatIn) + heatmapLegend() + '</div>' +
            heatChartIn +
          '</div>' +
        '</section>' +
      '</div>';

    switch(state.sub.inbound){
      case "inventario": return inventarioHtml;
      case "armazenagem": return armazenagemHtml;
      case "abastecimento": return abastecimentoHtml;
      case "rastreabilidade": return rastreabilidadeHtml;
      case "horarios": return horariosHtml;
      case "recebimento": default: return recebimentoHtml;
    }
  }

  /* ============================ PAGE: OUTBOUND ============================ */

  function platFilterList(){
    return state.plataforma === "todas" ? PLATAFORMAS.map(function(p){return p.id;}) : [state.plataforma];
  }
  function opFactorOut(day){
    if (state.operadorOut.length === 0) return 1;
    return sum(state.operadorOut, function(n){ return day.opOutbound[n] || 0; });
  }
  function coverageColor(pct){
    if (pct >= 95) return "var(--status-good)";
    if (pct >= 88) return "var(--status-warning)";
    return "var(--status-critical)";
  }

  function pageOutbound(){
    var cur = windowData(0);
    var prev = windowData(1);
    var pk = platFilterList();

    /* ---- Separação ---- */
    function sepBase(day, field){ return sum(pk, function(k){ return day.plataformas[k][field]; }); }
    function sepVal(day, field){ return opFactorOut(day) * sepBase(day, field); }
    var sepCur = sum(cur, function(d){return sepVal(d,"separados");});
    var sepPrev = sum(prev, function(d){return sepVal(d,"separados");});

    function tempoSepWin(arr){
      var tw = sum(arr, function(d){ return sum(pk, function(k){ return d.plataformas[k].tempoSep * d.plataformas[k].separados; }); });
      var vw = sum(arr, function(d){ return sum(pk, function(k){ return d.plataformas[k].separados; }); });
      return vw ? tw/vw : 0;
    }
    var tSepCur = tempoSepWin(cur), tSepPrev = tempoSepWin(prev);
    var prodSepCur = tSepCur ? 60/tSepCur : 0, prodSepPrev = tSepPrev ? 60/tSepPrev : 0;

    var sepKpis = [
      kpiCard("QTD de pedidos separados", fmtInt(sepCur), "", sepCur, sepPrev, "neutral", cur.map(function(d){return sepVal(d,"separados");}), "var(--ink-3)",
        metaBadge(sepCur/(cur.length||1), METAS.pedidosSepDia, true, fmtInt(METAS.pedidosSepDia) + "/dia")),
      kpiCard("Tempo médio de separação", fmtDec(tSepCur,1), "min/pedido", tSepCur, tSepPrev, "lower-better",
        cur.map(function(d){ var tw=sum(pk,function(k){return d.plataformas[k].tempoSep*d.plataformas[k].separados;}); var vw=sum(pk,function(k){return d.plataformas[k].separados;}); return vw?tw/vw:0; }), "var(--accent)"),
      kpiCard("Produtividade da separação", fmtDec(prodSepCur,0), "pedidos/h", prodSepCur, prodSepPrev, "higher-better",
        cur.map(function(d){ var tw=sum(pk,function(k){return d.plataformas[k].tempoSep*d.plataformas[k].separados;}); var vw=sum(pk,function(k){return d.plataformas[k].separados;}); var t=vw?tw/vw:0; return t?60/t:0; }), "var(--accent)",
        metaBadge(prodSepCur, METAS.produtividadeSep, true, fmtInt(METAS.produtividadeSep) + " pedidos/h"))
    ];


    var sepChart = pk.length > 1
      ? stackedBarChart("out-sep", cur, pk, function(d,k){ return d.plataformas[k].separados; }, plataformaColor, plataformaNome)
      : barChart("out-sep", cur, function(d){ return d.plataformas[pk[0]].separados; }, plataformaColor(pk[0]));

    var sepLegend = pk.length > 1 ? '<div class="legend">' + PLATAFORMAS.map(function(p){
      return '<div class="legend-item"><span class="dot" style="background:' + plataformaColor(p.id) + '"></span>' + p.nome + '</div>';
    }).join("") + '</div>' : '';

    var platResumoSep = '<div class="mini-table-title">Resumo por plataforma — separação</div><div class="table-wrap"><table><thead><tr><th>Plataforma</th><th>Pedidos separados</th><th>Tempo médio</th></tr></thead><tbody>' +
      PLATAFORMAS.map(function(p){
        var sep = sum(cur,function(d){return opFactorOut(d)*d.plataformas[p.id].separados;});
        var tw = sum(cur,function(d){return opFactorOut(d)*d.plataformas[p.id].tempoSep*d.plataformas[p.id].separados;});
        var t = sep ? tw/sep : 0;
        return '<tr><td><span class="dot" style="display:inline-block;margin-right:6px;background:' + plataformaColor(p.id) + '"></span>' + p.nome + '</td><td class="num">' + fmtInt(sep) + '</td><td class="num">' + fmtDec(t,1) + ' min</td></tr>';
      }).join("") + '</tbody></table></div>';

    var pesoTotal = sum(SKUS, function(s){ return s.peso; });
    var skuRankingSep = SKUS.map(function(s){ return {codigo:s.codigo, nome:s.nome, qtd: Math.round(sepCur * s.peso / pesoTotal)}; })
      .sort(function(a,b){ return b.qtd - a.qtd; });
    var skuClassesSep = classifyABC(skuRankingSep, sepCur);
    var skuTableSep = '<div class="table-wrap"><table id="tbl-sku-sep"><thead><tr><th>SKU</th><th>Descrição</th><th>Pedidos com este SKU</th><th>% do total</th><th>Classe ABC</th></tr></thead><tbody>' +
      skuRankingSep.map(function(s,i){
        var pct = sepCur ? (s.qtd/sepCur*100) : 0;
        return '<tr data-sku-row="' + (s.codigo + " " + s.nome).toLowerCase() + '"><td class="mono">' + s.codigo + '</td><td>' + s.nome + '</td><td class="num">' + fmtInt(s.qtd) + '</td><td class="num">' + fmtDec(pct,1) + '%</td><td>' + abcBadge(skuClassesSep[i]) + '</td></tr>';
      }).join("") + '</tbody></table></div>';

    /* ---- Embalagem ---- */
    function embBase(day, field){ return sum(pk, function(k){ return day.plataformas[k][field]; }); }
    function embVal(day, field){ return opFactorOut(day) * embBase(day, field); }
    var embCur = sum(cur, function(d){return embVal(d,"embalados");});
    var embPrev = sum(prev, function(d){return embVal(d,"embalados");});

    function tempoEmbWin(arr){
      var tw = sum(arr, function(d){ return sum(pk, function(k){ return d.plataformas[k].tempoEmb * d.plataformas[k].embalados; }); });
      var vw = sum(arr, function(d){ return sum(pk, function(k){ return d.plataformas[k].embalados; }); });
      return vw ? tw/vw : 0;
    }
    var tEmbCur = tempoEmbWin(cur), tEmbPrev = tempoEmbWin(prev);
    var prodEmbCur = tEmbCur ? 60/tEmbCur : 0, prodEmbPrev = tEmbPrev ? 60/tEmbPrev : 0;

    var embKpis = [
      kpiCard("QTD de pedidos embalados", fmtInt(embCur), "", embCur, embPrev, "neutral", cur.map(function(d){return embVal(d,"embalados");}), "var(--ink-3)"),
      kpiCard("Tempo médio de embalagem", fmtDec(tEmbCur,1), "min/pedido", tEmbCur, tEmbPrev, "lower-better",
        cur.map(function(d){ var tw=sum(pk,function(k){return d.plataformas[k].tempoEmb*d.plataformas[k].embalados;}); var vw=sum(pk,function(k){return d.plataformas[k].embalados;}); return vw?tw/vw:0; }), "var(--accent)"),
      kpiCard("Produtividade da embalagem", fmtDec(prodEmbCur,0), "pedidos/h", prodEmbCur, prodEmbPrev, "higher-better",
        cur.map(function(d){ var tw=sum(pk,function(k){return d.plataformas[k].tempoEmb*d.plataformas[k].embalados;}); var vw=sum(pk,function(k){return d.plataformas[k].embalados;}); var t=vw?tw/vw:0; return t?60/t:0; }), "var(--accent)",
        metaBadge(prodEmbCur, METAS.produtividadeEmb, true, fmtInt(METAS.produtividadeEmb) + " pedidos/h"))
    ];

    var embChart = pk.length > 1
      ? stackedBarChart("out-emb", cur, pk, function(d,k){ return d.plataformas[k].embalados; }, plataformaColor, plataformaNome)
      : barChart("out-emb", cur, function(d){ return d.plataformas[pk[0]].embalados; }, plataformaColor(pk[0]));

    var platResumoEmb = '<div class="mini-table-title">Resumo por plataforma — embalagem</div><div class="table-wrap"><table><thead><tr><th>Plataforma</th><th>Pedidos embalados</th><th>Tempo médio</th></tr></thead><tbody>' +
      PLATAFORMAS.map(function(p){
        var emb = sum(cur,function(d){return opFactorOut(d)*d.plataformas[p.id].embalados;});
        var tw = sum(cur,function(d){return opFactorOut(d)*d.plataformas[p.id].tempoEmb*d.plataformas[p.id].embalados;});
        var t = emb ? tw/emb : 0;
        return '<tr><td><span class="dot" style="display:inline-block;margin-right:6px;background:' + plataformaColor(p.id) + '"></span>' + p.nome + '</td><td class="num">' + fmtInt(emb) + '</td><td class="num">' + fmtDec(t,1) + ' min</td></tr>';
      }).join("") + '</tbody></table></div>';

    /* ---- Coletas / Expedição ---- */
    var pendentesHoje = AGENDA_COLETA.filter(function(r){return r.status==="pendente";}).length;
    var realizadasHoje = AGENDA_COLETA.filter(function(r){return r.status==="realizada";}).length;

    var prontosPeriodo = sum(cur, function(d){return sum(pk,function(k){return d.plataformas[k].embalados;});});
    var naoColetPeriodo = sum(cur, function(d){return sum(pk,function(k){return d.plataformas[k].naoColetados;});});
    var coletadosPeriodo = prontosPeriodo - naoColetPeriodo;
    var pctColetadoPeriodo = prontosPeriodo ? (coletadosPeriodo/prontosPeriodo*100) : 0;

    var prontosPrev = sum(prev, function(d){return sum(pk,function(k){return d.plataformas[k].embalados;});});
    var naoColetPrev = sum(prev, function(d){return sum(pk,function(k){return d.plataformas[k].naoColetados;});});
    var pctColetadoPrev = prontosPrev ? ((prontosPrev-naoColetPrev)/prontosPrev*100) : 0;

    var coletaKpis = [
      snapshotCard("Coletas pendentes hoje", fmtInt(pendentesHoje), "de " + AGENDA_COLETA.length, "agora: " + AGORA_HHMM),
      snapshotCard("Coletas realizadas hoje", fmtInt(realizadasHoje), "de " + AGENDA_COLETA.length, "agora: " + AGORA_HHMM),
      kpiCard("% coletado no período", fmtDec(pctColetadoPeriodo,1), "%", pctColetadoPeriodo, pctColetadoPrev, "higher-better", null, "var(--accent)",
        metaBadge(pctColetadoPeriodo, METAS.pctColetado, true, fmtInt(METAS.pctColetado) + "%")),
      kpiCard("Pedidos aguardando coleta", fmtInt(naoColetPeriodo), "no período", naoColetPeriodo, naoColetPrev, "lower-better", null, "var(--accent)")
    ];

    /* ---- Risco de atraso (SLA em tempo real, hoje) ---- */
    var riscoRows = AGENDA_COLETA.map(function(r){
      if (r.status === "realizada") return null;
      var minutosRestantes = hhmmToMin(r.corte) - hhmmToMin(AGORA_HHMM);
      var tempoNecessario = prodEmbCur ? (r.pendentesEmbalagem / prodEmbCur * 60) : 0;
      var nivel = minutosRestantes <= 0 ? "critical" : (tempoNecessario >= minutosRestantes ? "warning" : "good");
      var texto = nivel === "critical" ? "Corte já passou" : (nivel === "warning" ? "Risco de atraso" : "No prazo");
      return {row:r, minutosRestantes:minutosRestantes, tempoNecessario:tempoNecessario, nivel:nivel, texto:texto};
    }).filter(function(x){ return x !== null; });

    var riscoTable = riscoRows.length === 0
      ? '<div style="color:var(--ink-3); font-size:.85rem; padding:6px 0;">Todas as coletas de hoje já foram realizadas.</div>'
      : '<div class="table-wrap"><table><thead><tr><th>Empresa</th><th>Transportadora</th><th>Corte</th><th>Tempo até o corte</th><th>Pendentes de embalagem</th><th>Tempo estimado</th><th>Situação</th></tr></thead><tbody>' +
        riscoRows.map(function(x){
          var pillClass = x.nivel === "good" ? "done" : "pending";
          var color = "var(--status-" + (x.nivel==="critical"?"critical":(x.nivel==="warning"?"warning":"good")) + ")";
          return '<tr><td><span class="dot" style="display:inline-block;margin-right:6px;background:' + empresaColor(x.row.empresa) + '"></span>' + empresaNome(x.row.empresa) + '</td>' +
            '<td>' + x.row.transportadora + '</td><td class="mono">' + x.row.corte + '</td>' +
            '<td class="num">' + (x.minutosRestantes>0?fmtInt(x.minutosRestantes)+" min":"—") + '</td>' +
            '<td class="num">' + fmtInt(x.row.pendentesEmbalagem) + '</td>' +
            '<td class="num">' + fmtInt(x.tempoNecessario) + ' min</td>' +
            '<td><span class="pill ' + pillClass + '" style="' + (x.nivel==="critical"?"background:color-mix(in oklab, var(--status-critical) 16%, transparent); color:var(--status-critical);":"") + '">' + x.texto + '</span></td></tr>';
        }).join("") + '</tbody></table></div>';

    /* ---- Financeiro ---- */
    function custoMaoDeObra(day){
      return opFactorOut(day) * sum(pk, function(k){
        var pv = day.plataformas[k];
        return (pv.tempoSep*pv.separados + pv.tempoEmb*pv.embalados) / 60 * CUSTO_HORA_OPERADOR;
      });
    }
    var custoMaoObraCur = sum(cur, custoMaoDeObra);
    var custoMaoObraPrev = sum(prev, custoMaoDeObra);
    var custoPorPedidoCur = sepCur ? custoMaoObraCur/sepCur : 0;
    var custoPorPedidoPrev = sepPrev ? custoMaoObraPrev/sepPrev : 0;
    var custoColetaCur = coletadosPeriodo * CUSTO_COLETA_MEDIO;
    var custoColetaPrev = (prontosPrev - naoColetPrev) * CUSTO_COLETA_MEDIO;

    var custoEmpresaTable = '<div class="mini-table-title">Custo de coleta por empresa — agenda de hoje</div><div class="table-wrap"><table><thead><tr><th>Empresa</th><th>Transportadora(s)</th><th>Pedidos hoje</th><th>Custo estimado</th><th>Custo médio/pedido</th></tr></thead><tbody>' +
      EMPRESAS.map(function(e){
        var rows = AGENDA_COLETA.filter(function(r){ return r.empresa === e.id; });
        var pedidos = sum(rows, function(r){ return r.pedidos; });
        var custo = sum(rows, function(r){ return r.pedidos * (CUSTO_COLETA[r.transportadora] || CUSTO_COLETA_MEDIO); });
        var transp = rows.map(function(r){ return r.transportadora; }).filter(function(v,i,a){ return a.indexOf(v)===i; }).join(", ");
        return '<tr><td><span class="dot" style="display:inline-block;margin-right:6px;background:' + empresaColor(e.id) + '"></span>' + e.nome + '</td><td>' + transp + '</td><td class="num">' + fmtInt(pedidos) + '</td><td class="num">' + fmtBRL(custo) + '</td><td class="num">' + fmtBRL(pedidos?custo/pedidos:0) + '</td></tr>';
      }).join("") + '</tbody></table></div>';

    // Custo de mão de obra do Inbound (conferência + armazenagem + abastecimento), estimado via horas = unidades/produtividade.
    // Não é filtrado por plataforma (Inbound não tem essa dimensão) — soma o galpão inteiro no período.
    function custoMaoDeObraInboundDay(day){
      var confHoras = sum(EMPRESAS, function(e){ return day.empresas[e.id].tempoConf * day.empresas[e.id].volumes / 60; });

  function newFullDraft(){
    return {id:null, codigo:"", plataforma:FULL_EMPRESAS.length?FULL_EMPRESAS[0].id:"", dataAgendada:isoDate(TODAY), qtdSku:"", qtdItens:""};

  function fullById(id){ return FULLS.filter(function(f){ return f.id === id; })[0]; }
  function fullBadge(f){ return '<span class="dot" style="display:inline-block;margin-right:6px;background:' + fullEmpresaColor(f.plataforma) + '"></span>'; }

  var MESES_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  function fullCalendarMonthLabel(y,m){ return MESES_PT[m] + " de " + y; }
  function fullCalendarGrid(y, m){
    var first = new Date(y, m, 1);
    var startWeekday = first.getDay();
    var daysInMonth = new Date(y, m+1, 0).getDate();
    var todayIso = isoDate(TODAY);

    var fullsByDay = {};
    FULLS.forEach(function(f){ (fullsByDay[f.dataAgendada] = fullsByDay[f.dataAgendada] || []).push(f); });

    var cells = [];
    for (var i=0;i<startWeekday;i++) cells.push(null);
    for (var d=1; d<=daysInMonth; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);

    var head = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(function(w){ return '<div class="cal-head">' + w + '</div>'; }).join("");

    var body = cells.map(function(d){
      if (d === null) return '<div class="cal-cell cal-empty"></div>';
      var iso = y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
      var isToday = iso === todayIso;
      var dayFulls = fullsByDay[iso] || [];
      var chips = dayFulls.map(function(f){
        return '<div class="cal-chip" data-full-chip="' + f.id + '" style="border-left-color:' + fullEmpresaColor(f.plataforma) + '; cursor:pointer;">' +
          '<span class="dot" style="background:' + fullEmpresaColor(f.plataforma) + '"></span>' + escHtml(f.codigo) +
        '</div>';
      }).join("");
      return '<div class="cal-cell' + (isToday?" cal-today":"") + '"><div class="cal-daynum">' + d + '</div>' + chips + '</div>';
    }).join("");

    return '<div class="cal-wrap" style="position:relative;">' +
      '<div class="cal-grid">' + head + body + '</div>' +
      '<div class="tooltip full-tip" data-full-cal-tip></div>' +
    '</div>';
  }

  function fmtBytes(n){
    if (!n && n !== 0) return "—";
    if (n < 1024) return n + " B";
    if (n < 1024*1024) return fmtDec(n/1024,1) + " KB";
    return fmtDec(n/(1024*1024),1) + " MB";
  }
  function anexoIcon(tipo){
    tipo = tipo || "";
    if (tipo.indexOf("image/") === 0) return "🖼️";
    if (tipo.indexOf("pdf") > -1) return "📄";
    if (tipo.indexOf("video/") === 0) return "🎞️";
    if (tipo.indexOf("audio/") === 0) return "🎧";
    return "📎";
  }
  function anexoChip(a, removable){
    var isImg = (a.tipo||"").indexOf("image/") === 0;
    var url = mipAnexoPublicUrl(a.storagePath);
    var thumbHtml = isImg
      ? '<img class="anexo-thumb" src="' + url + '">'
      : '<div class="anexo-icon">' + anexoIcon(a.tipo) + '</div>';
    return '<div class="anexo-item" data-mip-anexo-open="' + escAttr(a.storagePath) + '" title="Abrir ' + escAttr(a.nome) + '">' +
      thumbHtml +
      '<div style="min-width:0; flex:1;"><div style="font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + escHtml(a.nome) + '</div>' +
      '<div style="color:var(--ink-3); font-size:.72rem;">' + fmtBytes(a.tamanho) + '</div></div>' +
      (removable ? '<button class="btn-danger" data-mip-anexo-remove="' + escAttr(a.storagePath) + '" title="Remover anexo">✕</button>' : '') +
    '</div>';
  }

          '<div class="form-field"><label>Título</label><input type="text" data-mip-field="titulo" value="' + escAttr(draft.titulo) + '" placeholder="Ex.: Como conferir um recebimento"></div>' +
          '<div class="form-field"><label>Palavras-chave (separadas por vírgula)</label><input type="text" data-mip-field="palavrasChaveText" value="' + escAttr(draft.palavrasChaveText) + '" placeholder="Ex.: recebimento, conferência, doca"></div>' +
          '<div class="form-field"><label>Conteúdo — passo a passo</label><textarea data-mip-field="conteudo" style="min-height:140px;">' + escHtml(draft.conteudo) + '</textarea></div>' +
        '</div>' +
        '<div class="form-field" style="margin-top:12px;"><label>Anexos (fotos, PDFs, documentos — qualquer formato)</label>' +
          '<input type="file" multiple data-mip-file-input>' +
        '</div>' +
        (draft.anexos && draft.anexos.length
          ? '<div style="display:flex; flex-direction:column; gap:6px; margin-top:10px;">' + draft.anexos.map(function(a){ return anexoChip(a, true); }).join("") + '</div>'
          : '') +
        (state.mipError ? '<div class="conn-error" style="margin-top:12px;">' + state.mipError + '</div>' : '') +
        '<div class="btn-row" style="margin-top:14px;"><button class="btn-primary" data-mip-save ' + (state.mipBusy?"disabled":"") + '>' + (state.mipBusy?"Salvando…":"Salvar MIP") + '</button></div>' +
      '</div>';
    }

    return '' +
    '<div class="topbar"><div><h1>Ajuda · MIP</h1><p>Manual Interno de Procedimentos — passo a passo de como fazer, com anexos.</p></div>' +
      (!draft ? '<div class="filters"><button class="btn-primary" data-mip-new>+ Novo MIP</button></div>' : '') +
    '</div>' +
    '<div class="content">' +
      '<section class="sector">' +
        '<div class="card-head" style="margin-bottom:4px;">' + skuSearchBox("mip-list", "Buscar por título ou palavra-chave…") + '</div>' +
        listCard +
        formCard +
      '</section>' +
    '</div>';
  }

  function pageAjuda(){
    switch(state.sub.ajuda){
      case "mip": return pageMip();
      case "faq": default: return pageFaq();
    }
  }

  /* ============================ RENDER / INTERACTIONS ============================ */

  function render(){
    var root = document.getElementById("root");
    var pageHtml;
    if (state.page === "geral") pageHtml = pageGeral();
    else if (state.page === "inbound") pageHtml = pageInbound();
    else if (state.page === "outbound") pageHtml = pageOutbound();
    else if (state.page === "fulfillment") pageHtml = pageFulfillment();
    else if (state.page === "ajuda") pageHtml = pageAjuda();
    else if (state.page === "insumos") pageHtml = pageInsumos();
    else pageHtml = pageFontes();
    root.innerHTML = '<div class="app">' + sidebarHtml() + '<div class="main">' + pageHtml + '</div></div>';
    wireInteractions();
    if (state.page === "geral") refreshTinyOutbound();
    if (state.fullHighlight !== null){
      var hlId = state.fullHighlight;
      var hlTarget = root.querySelector('[data-full-card="' + hlId + '"]');
      if (hlTarget){
        hlTarget.scrollIntoView({behavior:"smooth", block:"center"});
        hlTarget.classList.add("full-highlight");
        setTimeout(function(){
          var t2 = document.querySelector('[data-full-card="' + hlId + '"]');
          if (t2) t2.classList.remove("full-highlight");
        }, 2200);
      }
      state.fullHighlight = null;
    }
  }

  function wireInteractions(){
    var root = document.getElementById("root");

    /* ---- Fontes de Dados ---- */
    var connNewBtn = root.querySelector('[data-conn-new]');
    if (connNewBtn) connNewBtn.addEventListener("click", function(){
      state.connDraft = newConnectionDraft(); state.connPreview = null; state.connError = null; render();
    });
    var connCancelBtn = root.querySelector('[data-conn-cancel]');
    if (connCancelBtn) connCancelBtn.addEventListener("click", function(){
      state.connDraft = null; state.connPreview = null; state.connError = null; render();
    });
    root.querySelectorAll('[data-conn-edit]').forEach(function(el){
      el.addEventListener("click", function(){
        var idx = parseInt(el.getAttribute("data-conn-edit"),10);
        state.connDraft = CONNECTIONS[idx];
        state.connPreview = null; state.connError = null;
        render();
      });
    });
    root.querySelectorAll('[data-conn-remove]').forEach(function(el){
      el.addEventListener("click", function(){
        var idx = parseInt(el.getAttribute("data-conn-remove"),10);
        CONNECTIONS.splice(idx,1);
        saveConnections();
        render();
      });
    });
    root.querySelectorAll('[data-conn-sync]').forEach(function(el){
      el.addEventListener("click", function(){
        var idx = parseInt(el.getAttribute("data-conn-sync"),10);

      });
    });
    var previewBtn = root.querySelector('[data-conn-preview]');
    if (previewBtn) previewBtn.addEventListener("click", function(){ doPreview(); });
    var syncNewBtn = root.querySelector('[data-conn-sync-new]');
    if (syncNewBtn) syncNewBtn.addEventListener("click", function(){ doSyncDraft(); });
    root.querySelectorAll('input[data-conn-field], select[data-conn-field], textarea[data-conn-field]').forEach(function(el){
      el.addEventListener("change", function(){
        if (!state.connDraft) return;
        var field = el.getAttribute("data-conn-field");
        state.connDraft[field] = el.value;
        if (field === "targetAba"){ state.connPreview = null; state.connDraft.mapping = {}; }
        render();
      });
    });
    root.querySelectorAll('button[data-conn-field]').forEach(function(el){
      el.addEventListener("click", function(){
        if (!state.connDraft) return;
        var field = el.getAttribute("data-conn-field");
        var value = el.getAttribute("data-conn-value");
        state.connDraft[field] = value;
        state.connPreview = null;
        render();
      });
    });
    root.querySelectorAll('[data-conn-map]').forEach(function(el){
      el.addEventListener("change", function(){
        if (!state.connDraft) return;
        var key = el.getAttribute("data-conn-map");
        state.connDraft.mapping[key] = el.value;
        render();
      });
    });

    root.querySelectorAll("[data-nav]").forEach(function(el){
      el.addEventListener("click", function(){
        state.page = el.getAttribute("data-nav");
        render();
      });
    });

    /* ---- Nav: grupos Inbound/Outbound com subcategorias suspensas ---- */
    root.querySelectorAll("[data-nav-group]").forEach(function(el){
      el.addEventListener("click", function(){
        var group = el.getAttribute("data-nav-group");
        state.navExpanded = (state.navExpanded === group) ? null : group;
        state.page = group;
        render();
      });
    });
    root.querySelectorAll("[data-nav-sub-group]").forEach(function(el){
      el.addEventListener("click", function(){

    root.querySelectorAll('[data-usuario-edit]').forEach(function(el){

        state.usuarioError = null;
        render();
      });

    root.querySelectorAll('[data-usuario-remove]').forEach(function(el){
      el.addEventListener("click", function(){
        var id = parseInt(el.getAttribute("data-usuario-remove"),10);

    root.querySelectorAll('input[data-usuario-field]').forEach(function(el){

    var usuarioSaveBtn = root.querySelector('[data-usuario-save]');
    if (usuarioSaveBtn) usuarioSaveBtn.addEventListener("click", function(){

      var promessa = d.id === null ? criarUsuario(nome) : atualizarUsuario(d.id, nome);
      promessa.then(function(){
        state.usuarioDraft = null; state.usuarioError = null;

      }).catch(function(err){

        render();

    /* ---- Insumos ---- */
    var insumoNewBtn = root.querySelector('[data-insumo-new]');

    root.querySelectorAll('[data-insumo-remove]').forEach(function(el){

          SKU_INSUMO_MAP[codigo] = SKU_INSUMO_MAP[codigo].filter(function(v){ return v.insumoId !== id; });

        removerInsumo(id).then(render).catch(function(err){ alert("Falha ao remover insumo: " + err.message); });
      });

    root.querySelectorAll('input[data-insumo-field], select[data-insumo-field]').forEach(function(el){
      el.addEventListener("change", function(){
        if (!state.insumoDraft) return;
        var field = el.getAttribute("data-insumo-field");

        render();
      });

    var insumoSaveBtn = root.querySelector('[data-insumo-save]');
    if (insumoSaveBtn) insumoSaveBtn.addEventListener("click", function(){
      var d = state.insumoDraft;

      var dados = {nome:d.nome.trim(), categoria:(d.categoria||"").trim(), fornecedor:(d.fornecedor||"").trim(), valorUnitario:d.valorUnitario, unidade:d.unidade, estoque:d.estoque, estoqueMinimo:d.estoqueMinimo, observacao:(d.observacao||"").trim()};
      var promessa = d.id === null ? criarInsumo(dados) : atualizarInsumo(d.id, dados);
      promessa.then(function(){
        state.insumoDraft = null; state.insumoError = null;
        render();
      }).catch(function(err){
        state.insumoError = "Falha ao salvar: " + err.message;
        render();
      });
    });

    /* ---- Movimentação de estoque de insumos ---- */
    root.querySelectorAll('[data-insumo-mov-open]').forEach(function(el){
      el.addEventListener("click", function(){
        var id = parseInt(el.getAttribute("data-insumo-mov-open"),10);
        state.insumoMovDraft = {insumoId:id, tipo:"adicionar", valor:""};
        state.insumoMovError = null;
        render();
      });
    });
    var insumoMovCancelBtn = root.querySelector('[data-insumo-mov-cancel]');
    if (insumoMovCancelBtn) insumoMovCancelBtn.addEventListener("click", function(){
      state.insumoMovDraft = null; state.insumoMovError = null; render();
    });
    root.querySelectorAll('button[data-insumo-mov-field]').forEach(function(el){
      el.addEventListener("click", function(){
        if (!state.insumoMovDraft) return;
        state.insumoMovDraft.tipo = el.getAttribute("data-insumo-mov-value");
        render();
      });
    });
    root.querySelectorAll('input[data-insumo-mov-field]').forEach(function(el){
      el.addEventListener("change", function(){
        if (!state.insumoMovDraft) return;
        state.insumoMovDraft.valor = el.value;
        render();
      });
    });
    var insumoMovSaveBtn = root.querySelector('[data-insumo-mov-save]');
    if (insumoMovSaveBtn) insumoMovSaveBtn.addEventListener("click", function(){
      var md = state.insumoMovDraft;
      var ins = insumoById(md.insumoId);
      if (!ins) return;
      var valor = parseNumberFlexible(md.valor);
      if (valor <= 0 && md.tipo !== "ajustar"){ state.insumoMovError = "Informe uma quantidade maior que zero."; render(); return; }
      var antes = ins.estoque||0;
      var depois;
      if (md.tipo === "adicionar") depois = antes + valor;
      else if (md.tipo === "debitar"){
        if (valor > antes){ state.insumoMovError = "Não é possível debitar mais do que o estoque atual (" + fmtInt(antes) + " " + ins.unidade + ")."; render(); return; }
        depois = antes - valor;
      } else { depois = Math.round(valor); }
      var delta = depois - antes;
      atualizarInsumo(ins.id, {nome:ins.nome, categoria:ins.categoria, fornecedor:ins.fornecedor, valorUnitario:ins.valorUnitario, unidade:ins.unidade, estoque:depois, estoqueMinimo:ins.estoqueMinimo, observacao:ins.observacao})
        .then(function(){
          return registrarInsumoMov({insumoId:ins.id, tipo:md.tipo, valor:(md.tipo==="ajustar"?depois:valor), estoqueAntes:antes, estoqueDepois:depois, delta:delta});
        })
        .then(function(){
          state.insumoMovDraft = null; state.insumoMovError = null;
          render();
        })
        .catch(function(err){
          state.insumoMovError = "Falha ao salvar: " + err.message;
          render();
        });
    });
    root.querySelectorAll('[data-insumomov-remove]').forEach(function(el){

    root.querySelectorAll("[data-insumo-period]").forEach(function(el){

    root.querySelectorAll("[data-insumo-date]").forEach(function(el){

      if (!d.dataAgendada){ state.fullError = "Informe a data agendada."; render(); return; }
      var qtdSku = Math.round(parseNumberFlexible(d.qtdSku));

      var dados = {codigo:d.codigo.trim(), plataforma:d.plataforma, dataAgendada:d.dataAgendada, qtdSku:qtdSku, qtdItens:qtdItens};
      if (d.id === null){
        criarFull(dados).then(function(){
          state.fullDraft = null; state.fullError = null;
